<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001433"/>
      <stop offset="35%" stop-color="#002C66"/>
      <stop offset="70%" stop-color="#003273"/>
      <stop offset="100%" stop-color="#001a40"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#FFB515"/>
      <stop offset="100%" stop-color="#C28600"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0069F2"/>
      <stop offset="100%" stop-color="#004DB3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 105, 242, 0.12)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bgGrad)"/>
  <rect width="1024" height="1024" fill="url(#grid)"/>

  <!-- Ornaments &amp; Outer Frame -->
  <rect x="36" y="36" width="952" height="952" rx="20" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.85"/>
  <rect x="48" y="48" width="928" height="928" rx="14" fill="none" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>

  <!-- Corner Brackets -->
  <path d="M 60 100 L 60 60 L 100 60" fill="none" stroke="#FFB515" stroke-width="4"/>
  <path d="M 964 100 L 964 60 L 924 60" fill="none" stroke="#FFB515" stroke-width="4"/>
  <path d="M 60 924 L 60 964 L 100 964" fill="none" stroke="#FFB515" stroke-width="4"/>
  <path d="M 964 924 L 964 964 L 924 964" fill="none" stroke="#FFB515" stroke-width="4"/>

  <!-- Top Header Badge -->
  <rect x="292" y="80" width="440" height="34" rx="17" fill="rgba(0, 44, 102, 0.9)" stroke="#004DB3" stroke-width="1.5"/>
  <text x="512" y="102" fill="#FFB515" font-size="13" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="3" text-anchor="middle">
    POLICÍA DE TIERRA DEL FUEGO • CUSTODIA VIP
  </text>

  <!-- Module Big Badge -->
  <text x="512" y="195" fill="#FFB515" font-size="52" font-family="'Outfit', sans-serif" font-weight="900" letter-spacing="6" text-anchor="middle" filter="url(#glow)">
    MÓDULO 07
  </text>

  <!-- Title &amp; Subtitle -->
  <text x="512" y="250" fill="#ffffff" font-size="28" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle" letter-spacing="1">
    PRIMEROS AUXILIOS TÁCTICOS Y TECC
  </text>
  <text x="512" y="285" fill="#cbd5e1" font-size="16" font-family="'Inter', sans-serif" font-weight="500" text-anchor="middle">
    Medicina Táctica Operacional, RCP y Desfibrilador (DEA)
  </text>

  <!-- Horizontal divider with diamond -->
  <line x1="200" y1="315" x2="480" y2="315" stroke="rgba(0, 105, 242, 0.5)" stroke-width="2"/>
  <polygon points="512,308 522,315 512,322 502,315" fill="#FFB515"/>
  <line x1="544" y1="315" x2="824" y2="315" stroke="rgba(0, 105, 242, 0.5)" stroke-width="2"/>

  <!-- Tactical Shield Emblem in Center -->
  <g transform="translate(512, 530)">
    <!-- Shield Outer Glow -->
    <path d="M 0 -170 C 130 -170 190 -120 190 20 C 190 140 80 200 0 240 C -80 200 -190 140 -190 20 C -190 -120 -130 -170 0 -170 Z" 
          fill="rgba(0, 50, 115, 0.7)" stroke="#FFB515" stroke-width="4" filter="url(#glow)"/>
    <path d="M 0 -150 C 110 -150 165 -105 165 20 C 165 125 70 175 0 215 C -70 175 -165 125 -165 20 C -165 -105 -110 -150 0 -150 Z" 
          fill="none" stroke="rgba(0, 105, 242, 0.7)" stroke-width="2" stroke-dasharray="6,4"/>

    <!-- Concentric radar circles -->
    <circle cx="0" cy="20" r="110" fill="none" stroke="rgba(0, 105, 242, 0.3)" stroke-width="1.5"/>
    <circle cx="0" cy="20" r="70" fill="none" stroke="rgba(255, 181, 21, 0.3)" stroke-width="1.5"/>
    <circle cx="0" cy="20" r="30" fill="none" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1"/>

    <!-- Tactical Crosshair -->
    <line x1="-125" y1="20" x2="125" y2="20" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
    <line x1="0" y1="-105" x2="0" y2="145" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>

    <!-- Shield Icon / Silhouette -->
    <!-- Dignitary / Protector Icon -->
    <circle cx="0" cy="-30" r="28" fill="#FFB515"/>
    <path d="M -45 50 C -45 0 -25 -10 0 -10 C 25 -10 45 0 45 50 C 45 65 30 70 0 70 C -30 70 -45 65 -45 50 Z" fill="#FFB515"/>
    <!-- Guard Shield -->
    <path d="M 0 0 L 25 15 L 20 50 L 0 65 L -20 50 L -25 15 Z" fill="#002C66" stroke="#ffffff" stroke-width="2.5"/>
    <!-- Star of Excellence -->
    <polygon points="0,20 4,32 16,32 6,40 10,52 0,44 -10,52 -6,40 -16,32 -4,32" fill="#FFB515"/>

    <!-- Laurel Leaves -->
    <path d="M -130 90 C -150 40 -140 -20 -100 -70" fill="none" stroke="#FFB515" stroke-width="2.5"/>
    <path d="M 130 90 C 150 40 140 -20 100 -70" fill="none" stroke="#FFB515" stroke-width="2.5"/>
  </g>

  <!-- Specification Box -->
  <g transform="translate(512, 825)">
    <rect x="-340" y="-35" width="680" height="70" rx="14" fill="rgba(0, 31, 72, 0.85)" stroke="#004DB3" stroke-width="1.5"/>
    <text x="0" y="-8" fill="#FFB515" font-size="14" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="2" text-anchor="middle">
      SECCIÓN IV: CUIDADOS TÁCTICOS EN ESCENA • POLICÍA TDF
    </text>
    <text x="0" y="18" fill="#ffffff" font-size="12" font-family="'Inter', sans-serif" font-weight="500" text-anchor="middle">
      Cadena de Supervivencia, Manejo de Hemorragias Masivas y Triage
    </text>
  </g>

  <!-- Bottom Footer -->
  <text x="512" y="930" fill="#94a3b8" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle" letter-spacing="1">
    MANUAL DE PROTECCIÓN Y SEGURIDAD PARA DIGNATARIOS • EDICIÓN OFICIAL 2026
  </text>
</svg>