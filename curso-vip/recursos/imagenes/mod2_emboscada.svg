<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
    
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001433"/>
      <stop offset="35%" stop-color="#002C66"/>
      <stop offset="70%" stop-color="#003273"/>
      <stop offset="100%" stop-color="#001a40"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#FFB515"/>
      <stop offset="100%" stop-color="#C28600"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0069F2"/>
      <stop offset="100%" stop-color="#004DB3"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0, 50, 115, 0.9)"/>
      <stop offset="100%" stop-color="rgba(0, 26, 64, 0.9)"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 105, 242, 0.12)" stroke-width="1"/>
    </pattern>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#FFB515" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0069F2" />
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
    
  <!-- Background -->
  <rect width="900" height="520" fill="url(#bgGrad)"/>
  <rect width="900" height="520" fill="url(#grid)"/>

  <!-- Tactical Borders -->
  <rect x="20" y="20" width="860" height="480" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.85"/>
  <rect x="30" y="30" width="840" height="460" rx="12" fill="none" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1"/>

  <!-- Corner Brackets -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 70 L 860 40 L 830 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 40 450 L 40 480 L 70 480" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 450 L 860 480 L 830 480" fill="none" stroke="#FFB515" stroke-width="3"/>

  <!-- Header Badge -->
  <rect x="230" y="45" width="440" height="30" rx="15" fill="rgba(0, 44, 102, 0.95)" stroke="#004DB3" stroke-width="1.5"/>
  <text x="450" y="65" fill="#FFB515" font-size="12" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="2.5" text-anchor="middle">
    POLICÍA DE TIERRA DEL FUEGO • CONTRAEMBOSCADA
  </text>

  <!-- Title & Subtitle -->
  <text x="450" y="112" fill="#ffffff" font-size="24" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle" letter-spacing="0.5">
    ANATOMÍA DE LA EMBOSCADA Y RUPTURA DE RUTINA
  </text>
  <text x="450" y="138" fill="#7FB3FF" font-size="14" font-family="'Inter', sans-serif" font-weight="500" text-anchor="middle">
    Estructura de la Zona de Muerte (Kill Zone) y Medidas Preventivas
  </text>

  <line x1="200" y1="155" x2="430" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  <polygon points="450,150 457,155 450,160 443,155" fill="#FFB515"/>
  <line x1="470" y1="155" x2="700" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  

    <!-- Left Box: Kill Zone Scheme -->
    <rect x="60" y="180" width="370" height="290" rx="12" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="2"/>
    <rect x="60" y="180" width="370" height="40" rx="12" fill="#7f1d1d"/>
    <text x="245" y="206" fill="#fca5a5" font-size="14" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">ANATOMÍA DE LA EMBOSCADA</text>

    <!-- Road / Kill Zone visual -->
    <rect x="100" y="240" width="290" height="70" rx="6" fill="#001433" stroke="#004DB3" stroke-width="1.5"/>
    <line x1="100" y1="275" x2="390" y2="275" stroke="#facc15" stroke-width="2" stroke-dasharray="8 6"/>

    <!-- Ambush zone box -->
    <rect x="190" y="240" width="110" height="70" fill="rgba(239, 68, 68, 0.3)" stroke="#ef4444" stroke-width="2"/>
    <text x="245" y="280" fill="#ef4444" font-size="12" font-family="'Outfit', sans-serif" font-weight="900" text-anchor="middle">KILL ZONE</text>

    <!-- Hostile Shooters on sides -->
    <text x="245" y="232" fill="#f87171" font-size="13" font-weight="700" text-anchor="middle">⚠️ FUEGO CRUZADO ⚠️</text>
    <text x="245" y="326" fill="#f87171" font-size="13" font-weight="700" text-anchor="middle">⚠️ BLOQUEO / OBSTÁCULO ⚠️</text>

    <text x="245" y="355" fill="#ffffff" font-size="12" font-family="'Inter', sans-serif" font-weight="600" text-anchor="middle">Requisitos del Oponente para emboscar:</text>
    <text x="245" y="380" fill="#fca5a5" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">1. Saber DÓNDE estará el dignatario (Ruta fija)</text>
    <text x="245" y="400" fill="#fca5a5" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">2. Saber CUÁNDO estará (Horario predecible)</text>
    <text x="245" y="430" fill="#38bdf8" font-size="12" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">SI RUTEAMOS AL AZAR, ANULAMOS EL PLAN</text>

    <!-- Right Box: 4 Preventative Pillars -->
    <rect x="470" y="180" width="370" height="290" rx="12" fill="url(#cardGrad)" stroke="#34d399" stroke-width="2"/>
    <rect x="470" y="180" width="370" height="40" rx="12" fill="#064e3b"/>
    <text x="655" y="206" fill="#6ee7b7" font-size="14" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">4 REGLAS ANTI-EMBOSCADA</text>

    <text x="495" y="245" fill="#FFB515" font-size="13" font-family="'Inter', sans-serif" font-weight="800">1. 🔀 Romper la Rutina Absolutamente</text>
    <text x="515" y="265" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">Nunca utilizar el mismo trayecto dos días seguidos.</text>

    <text x="495" y="295" fill="#FFB515" font-size="13" font-family="'Inter', sans-serif" font-weight="800">2. ⏰ Alterar Horarios Sistemáticamente</text>
    <text x="515" y="315" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">Variar la hora de salida y arribo en 15-30 minutos.</text>

    <text x="495" y="345" fill="#FFB515" font-size="13" font-family="'Inter', sans-serif" font-weight="800">3. 🗺️ Mapear y Evitar Embudos</text>
    <text x="515" y="365" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">Identificar chokepoints naturales, puentes y túneles.</text>

    <text x="495" y="395" fill="#FFB515" font-size="13" font-family="'Inter', sans-serif" font-weight="800">4. 🤫 Secreto Estricto de Itinerario</text>
    <text x="515" y="415" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">Cero difusión previa en redes y agenda pública filtrada.</text>

    <rect x="495" y="435" width="320" height="24" rx="6" fill="#002C66"/>
    <text x="655" y="451" fill="#34d399" font-size="11" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">"La mejor respuesta a una emboscada es no entrar en ella"</text>
  </svg>