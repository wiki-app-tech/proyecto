<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
    
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001433"/>
      <stop offset="35%" stop-color="#002C66"/>
      <stop offset="70%" stop-color="#003273"/>
      <stop offset="100%" stop-color="#001a40"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#FFB515"/>
      <stop offset="100%" stop-color="#C28600"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0069F2"/>
      <stop offset="100%" stop-color="#004DB3"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0, 50, 115, 0.9)"/>
      <stop offset="100%" stop-color="rgba(0, 26, 64, 0.9)"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 105, 242, 0.12)" stroke-width="1"/>
    </pattern>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#FFB515" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0069F2" />
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
    
  <!-- Background -->
  <rect width="900" height="500" fill="url(#bgGrad)"/>
  <rect width="900" height="500" fill="url(#grid)"/>

  <!-- Tactical Borders -->
  <rect x="20" y="20" width="860" height="460" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.85"/>
  <rect x="30" y="30" width="840" height="440" rx="12" fill="none" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1"/>

  <!-- Corner Brackets -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 70 L 860 40 L 830 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 40 430 L 40 460 L 70 460" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 430 L 860 460 L 830 460" fill="none" stroke="#FFB515" stroke-width="3"/>

  <!-- Header Badge -->
  <rect x="230" y="45" width="440" height="30" rx="15" fill="rgba(0, 44, 102, 0.95)" stroke="#004DB3" stroke-width="1.5"/>
  <text x="450" y="65" fill="#FFB515" font-size="12" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="2.5" text-anchor="middle">
    POLICÍA DE TIERRA DEL FUEGO • DOCTRINA DE AVANZADA
  </text>

  <!-- Title & Subtitle -->
  <text x="450" y="112" fill="#ffffff" font-size="24" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle" letter-spacing="0.5">
    LA ANTICIPACIÓN COMO ESTRATEGIA DE NEUTRALIZACIÓN
  </text>
  <text x="450" y="138" fill="#7FB3FF" font-size="14" font-family="'Inter', sans-serif" font-weight="500" text-anchor="middle">
    Curva Tiempo vs. Riesgo: De la Reacción Imprudente a la Prevención Metódica
  </text>

  <line x1="200" y1="155" x2="430" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  <polygon points="450,150 457,155 450,160 443,155" fill="#FFB515"/>
  <line x1="470" y1="155" x2="700" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  

    <!-- Graphic Chart -->
    <rect x="80" y="180" width="740" height="250" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.8"/>

    <!-- Axes -->
    <line x1="160" y1="380" x2="760" y2="380" stroke="#004DB3" stroke-width="2"/>
    <line x1="160" y1="380" x2="160" y2="210" stroke="#004DB3" stroke-width="2"/>
    <text x="140" y="220" fill="#f87171" font-size="11" font-family="'Outfit', sans-serif" font-weight="700" text-anchor="end">ALTO RIESGO</text>
    <text x="140" y="375" fill="#34d399" font-size="11" font-family="'Outfit', sans-serif" font-weight="700" text-anchor="end">BAJO RIESGO</text>
    <text x="760" y="405" fill="#7FB3FF" font-size="11" font-family="'Outfit', sans-serif" font-weight="700" text-anchor="end">TIEMPO PREVIO (DÍAS / HORAS) ➜</text>

    <!-- Curve -->
    <path d="M 180 230 C 260 240, 360 310, 500 340 C 620 360, 700 365, 740 365" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>

    <!-- Point A: Reacción (Short Term) -->
    <circle cx="200" cy="235" r="10" fill="#ef4444" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>
    <rect x="220" y="215" width="200" height="45" rx="6" fill="#7f1d1d" stroke="#ef4444" stroke-width="1"/>
    <text x="230" y="233" fill="#ffffff" font-size="11" font-family="'Outfit', sans-serif" font-weight="800">REACCIÓN (Corto Plazo / T-0)</text>
    <text x="230" y="248" fill="#fca5a5" font-size="10" font-family="'Inter', sans-serif">Riesgo Máximo • Fuego hostil</text>

    <!-- Point B: Anticipación (Long Term) -->
    <circle cx="700" cy="365" r="10" fill="#34d399" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>
    <rect x="520" y="300" width="210" height="45" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
    <text x="530" y="318" fill="#ffffff" font-size="11" font-family="'Outfit', sans-serif" font-weight="800">ANTICIPACIÓN (T - 48h a 72h)</text>
    <text x="530" y="333" fill="#a7f3d0" font-size="10" font-family="'Inter', sans-serif">Riesgo Mínimo • Control total</text>

    <text x="450" y="465" fill="#cbd5e1" font-size="12" font-family="'Inter', sans-serif" font-weight="600" text-anchor="middle">
      "El peligro no siempre golpea, pero quien lo prevé y se prepara, convierte la incertidumbre en dominio"
    </text>
  </svg>