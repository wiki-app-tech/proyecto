<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
    
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001433"/>
      <stop offset="35%" stop-color="#002C66"/>
      <stop offset="70%" stop-color="#003273"/>
      <stop offset="100%" stop-color="#001a40"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#FFB515"/>
      <stop offset="100%" stop-color="#C28600"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0069F2"/>
      <stop offset="100%" stop-color="#004DB3"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0, 50, 115, 0.9)"/>
      <stop offset="100%" stop-color="rgba(0, 26, 64, 0.9)"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 105, 242, 0.12)" stroke-width="1"/>
    </pattern>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#FFB515" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0069F2" />
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
    
  <!-- Background -->
  <rect width="900" height="500" fill="url(#bgGrad)"/>
  <rect width="900" height="500" fill="url(#grid)"/>

  <!-- Tactical Borders -->
  <rect x="20" y="20" width="860" height="460" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.85"/>
  <rect x="30" y="30" width="840" height="440" rx="12" fill="none" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1"/>

  <!-- Corner Brackets -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 70 L 860 40 L 830 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 40 430 L 40 460 L 70 460" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 430 L 860 460 L 830 460" fill="none" stroke="#FFB515" stroke-width="3"/>

  <!-- Header Badge -->
  <rect x="230" y="45" width="440" height="30" rx="15" fill="rgba(0, 44, 102, 0.95)" stroke="#004DB3" stroke-width="1.5"/>
  <text x="450" y="65" fill="#FFB515" font-size="12" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="2.5" text-anchor="middle">
    POLICÍA DE TIERRA DEL FUEGO • TRIAJE Y VIGILANCIA
  </text>

  <!-- Title & Subtitle -->
  <text x="450" y="112" fill="#ffffff" font-size="24" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle" letter-spacing="0.5">
    CONCIENCIA SITUACIONAL: DETECCIÓN DE SINTOMATOLOGÍA
  </text>
  <text x="450" y="138" fill="#7FB3FF" font-size="14" font-family="'Inter', sans-serif" font-weight="500" text-anchor="middle">
    Algoritmo de Identificación Temprana y Reporte Discreto en la Cápsula
  </text>

  <line x1="200" y1="155" x2="430" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  <polygon points="450,150 457,155 450,160 443,155" fill="#FFB515"/>
  <line x1="470" y1="155" x2="700" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  

    <!-- 3 Symptoms Indicators -->
    <rect x="60" y="190" width="230" height="150" rx="10" fill="url(#cardGrad)" stroke="#f87171" stroke-width="1.8"/>
    <text x="175" y="220" fill="#f87171" font-size="13" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">🤒 FIEBRE ALTA</text>
    <text x="175" y="245" fill="#ffffff" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">Temperatura &gt; 37.5°C</text>
    <text x="175" y="265" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">Rubor facial, sudoración fría</text>
    <text x="175" y="285" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">Escalofríos en servicio</text>

    <rect x="335" y="190" width="230" height="150" rx="10" fill="url(#cardGrad)" stroke="#facc15" stroke-width="1.8"/>
    <text x="450" y="220" fill="#facc15" font-size="13" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">🗣️ TOS Y DISNEA</text>
    <text x="450" y="245" fill="#ffffff" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">Tos seca persistente</text>
    <text x="450" y="265" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">Dificultad respiratoria</text>
    <text x="450" y="285" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">Respiración entrecortada</text>

    <rect x="610" y="190" width="230" height="150" rx="10" fill="url(#cardGrad)" stroke="#a78bfa" stroke-width="1.8"/>
    <text x="725" y="220" fill="#a78bfa" font-size="13" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">👃 ANOSMIA / DISGEUSIA</text>
    <text x="725" y="245" fill="#ffffff" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">Pérdida de gusto/olfato</text>
    <text x="725" y="265" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">Cefalea súbita intensa</text>
    <text x="725" y="285" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">Fatiga muscular extrema</text>

    <!-- Rapid Action Algorithm -->
    <rect x="60" y="360" width="780" height="90" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2"/>
    <text x="450" y="385" fill="#38bdf8" font-size="13" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">
      ALGORITMO DE ACCIÓN RÁPIDA ANTE SÍNTOMAS
    </text>

    <!-- 3 Steps -->
    <text x="170" y="415" fill="#FFB515" font-size="11" font-family="'Inter', sans-serif" font-weight="700">1. IDENTIFICACIÓN</text>
    <text x="170" y="433" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif">Auto-reporte o alerta visual</text>

    <path d="M 280 420 L 320 420" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <text x="420" y="415" fill="#FFB515" font-size="11" font-family="'Inter', sans-serif" font-weight="700">2. REPORTE DISCRETO</text>
    <text x="420" y="433" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif">Canal radio interno al Jefe</text>

    <path d="M 540 420 L 580 420" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <text x="680" y="415" fill="#34d399" font-size="11" font-family="'Inter', sans-serif" font-weight="700">3. RELEVO LIMPIO</text>
    <text x="680" y="433" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif">Extracción a Zona Roja</text>

    <text x="450" y="475" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">
      "Ocultar un síntoma por orgullo profesional es un acto de indisciplina táctica grave"
    </text>
  </svg>