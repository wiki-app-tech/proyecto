<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
    
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001433"/>
      <stop offset="35%" stop-color="#002C66"/>
      <stop offset="70%" stop-color="#003273"/>
      <stop offset="100%" stop-color="#001a40"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#FFB515"/>
      <stop offset="100%" stop-color="#C28600"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0069F2"/>
      <stop offset="100%" stop-color="#004DB3"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0, 50, 115, 0.9)"/>
      <stop offset="100%" stop-color="rgba(0, 26, 64, 0.9)"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 105, 242, 0.12)" stroke-width="1"/>
    </pattern>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#FFB515" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0069F2" />
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
    
  <!-- Background -->
  <rect width="900" height="500" fill="url(#bgGrad)"/>
  <rect width="900" height="500" fill="url(#grid)"/>

  <!-- Tactical Borders -->
  <rect x="20" y="20" width="860" height="460" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.85"/>
  <rect x="30" y="30" width="840" height="440" rx="12" fill="none" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1"/>

  <!-- Corner Brackets -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 70 L 860 40 L 830 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 40 430 L 40 460 L 70 460" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 430 L 860 460 L 830 460" fill="none" stroke="#FFB515" stroke-width="3"/>

  <!-- Header Badge -->
  <rect x="230" y="45" width="440" height="30" rx="15" fill="rgba(0, 44, 102, 0.95)" stroke="#004DB3" stroke-width="1.5"/>
  <text x="450" y="65" fill="#FFB515" font-size="12" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="2.5" text-anchor="middle">
    POLICÍA DE TIERRA DEL FUEGO • CICLO PROTECTIVO
  </text>

  <!-- Title & Subtitle -->
  <text x="450" y="112" fill="#ffffff" font-size="24" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle" letter-spacing="0.5">
    LAS 4 FASES DE LA OPERACIÓN DE CUSTODIA
  </text>
  <text x="450" y="138" fill="#7FB3FF" font-size="14" font-family="'Inter', sans-serif" font-weight="500" text-anchor="middle">
    Ciclo secuencial permanente desde el planeamiento hasta la evaluación post-misión
  </text>

  <line x1="200" y1="155" x2="430" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  <polygon points="450,150 457,155 450,160 443,155" fill="#FFB515"/>
  <line x1="470" y1="155" x2="700" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  

    <rect x="60" y="210" width="175" height="210" rx="10" fill="url(#cardGrad)" stroke="#0069F2" stroke-width="2"/>
    <circle cx="147" cy="255" r="22" fill="#001f48" stroke="#0069F2" stroke-width="2"/>
    <text x="147" y="262" fill="#ffffff" font-size="16" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">1</text>
    <text x="147" y="300" fill="#7FB3FF" font-size="14" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">FASE PREVIA</text>
    <line x1="80" y1="315" x2="215" y2="315" stroke="rgba(255,255,255,0.1)"/>
    <text x="147" y="338" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• Avanzada (RECCE)</text>
    <text x="147" y="358" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• Plan OPORD</text>
    <text x="147" y="378" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• Briefing táctico</text>
    <text x="147" y="398" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• Inspección de EPP</text>

    <path d="M 245 315 L 265 315" stroke="#FFB515" stroke-width="2" marker-end="url(#arrowGold)"/>

    <rect x="275" y="210" width="175" height="210" rx="10" fill="url(#cardGrad)" stroke="#FFB515" stroke-width="2"/>
    <circle cx="362" cy="255" r="22" fill="#001f48" stroke="#FFB515" stroke-width="2"/>
    <text x="362" y="262" fill="#FFB515" font-size="16" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">2</text>
    <text x="362" y="300" fill="#FFB515" font-size="14" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">TRÁNSITO</text>
    <line x1="295" y1="315" x2="430" y2="315" stroke="rgba(255,181,21,0.2)"/>
    <text x="362" y="338" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• Convoy activo</text>
    <text x="362" y="358" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• Monitoreo radial</text>
    <text x="362" y="378" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• Puntos de control</text>
    <text x="362" y="398" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• Rutas de escape</text>

    <path d="M 460 315 L 480 315" stroke="#FFB515" stroke-width="2" marker-end="url(#arrowGold)"/>

    <rect x="490" y="210" width="175" height="210" rx="10" fill="url(#cardGrad)" stroke="#0069F2" stroke-width="2"/>
    <circle cx="577" cy="255" r="22" fill="#001f48" stroke="#0069F2" stroke-width="2"/>
    <text x="577" y="262" fill="#ffffff" font-size="16" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">3</text>
    <text x="577" y="300" fill="#7FB3FF" font-size="14" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">DESTINO</text>
    <line x1="510" y1="315" x2="645" y2="315" stroke="rgba(255,255,255,0.1)"/>
    <text x="577" y="338" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• Desembarco (Debus)</text>
    <text x="577" y="358" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• Cápsula a pie</text>
    <text x="577" y="378" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• Control de Safe Room</text>
    <text x="577" y="398" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• Cobertura 360°</text>

    <path d="M 675 315 L 695 315" stroke="#FFB515" stroke-width="2" marker-end="url(#arrowGold)"/>

    <rect x="705" y="210" width="175" height="210" rx="10" fill="url(#cardGrad)" stroke="#34d399" stroke-width="2"/>
    <circle cx="792" cy="255" r="22" fill="#001f48" stroke="#34d399" stroke-width="2"/>
    <text x="792" y="262" fill="#34d399" font-size="16" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">4</text>
    <text x="792" y="300" fill="#34d399" font-size="14" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">DEBRIEFING</text>
    <line x1="725" y1="315" x2="860" y2="315" stroke="rgba(255,255,255,0.1)"/>
    <text x="792" y="338" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• Informe post-misión</text>
    <text x="792" y="358" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• Registro de novedades</text>
    <text x="792" y="378" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• Mantenimiento equipo</text>
    <text x="792" y="398" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• Lecciones aprendidas</text>

    <path d="M 792 430 L 792 460 L 147 460 L 147 430" fill="none" stroke="#7FB3FF" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowBlue)"/>
    <text x="470" y="455" fill="#7FB3FF" font-size="11" font-family="'Inter', sans-serif" font-weight="600" text-anchor="middle">Ciclo de Retroalimentación y Mejora Doctrinal Continua</text>
  </svg>