<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
    
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001433"/>
      <stop offset="35%" stop-color="#002C66"/>
      <stop offset="70%" stop-color="#003273"/>
      <stop offset="100%" stop-color="#001a40"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#FFB515"/>
      <stop offset="100%" stop-color="#C28600"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0069F2"/>
      <stop offset="100%" stop-color="#004DB3"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0, 50, 115, 0.9)"/>
      <stop offset="100%" stop-color="rgba(0, 26, 64, 0.9)"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 105, 242, 0.12)" stroke-width="1"/>
    </pattern>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#FFB515" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0069F2" />
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
    
  <!-- Background -->
  <rect width="900" height="500" fill="url(#bgGrad)"/>
  <rect width="900" height="500" fill="url(#grid)"/>

  <!-- Tactical Borders -->
  <rect x="20" y="20" width="860" height="460" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.85"/>
  <rect x="30" y="30" width="840" height="440" rx="12" fill="none" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1"/>

  <!-- Corner Brackets -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 70 L 860 40 L 830 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 40 430 L 40 460 L 70 460" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 430 L 860 460 L 830 460" fill="none" stroke="#FFB515" stroke-width="3"/>

  <!-- Header Badge -->
  <rect x="230" y="45" width="440" height="30" rx="15" fill="rgba(0, 44, 102, 0.95)" stroke="#004DB3" stroke-width="1.5"/>
  <text x="450" y="65" fill="#FFB515" font-size="12" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="2.5" text-anchor="middle">
    POLICÍA DE TIERRA DEL FUEGO • SOPORTE DE CRISIS
  </text>

  <!-- Title & Subtitle -->
  <text x="450" y="112" fill="#ffffff" font-size="24" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle" letter-spacing="0.5">
    INFRAESTRUCTURA DE SOPORTE Y ANILLOS DE EMERGENCIA
  </text>
  <text x="450" y="138" fill="#7FB3FF" font-size="14" font-family="'Inter', sans-serif" font-weight="500" text-anchor="middle">
    Anillos de Respuesta de 5 y 10 Minutos hacia Centros Quirúrgicos y ZAE
  </text>

  <line x1="200" y1="155" x2="430" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  <polygon points="450,150 457,155 450,160 443,155" fill="#FFB515"/>
  <line x1="470" y1="155" x2="700" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  

    <!-- Concentric Circles Diagram -->
    <circle cx="450" cy="330" r="140" fill="rgba(0, 105, 242, 0.08)" stroke="#0069F2" stroke-width="1.5" stroke-dasharray="6 4"/>
    <circle cx="450" cy="330" r="90" fill="rgba(255, 181, 21, 0.08)" stroke="#FFB515" stroke-width="1.5" stroke-dasharray="6 4"/>

    <!-- Center: Objetivo -->
    <circle cx="450" cy="330" r="30" fill="#002C66" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>
    <text x="450" y="325" font-size="18" text-anchor="middle">🏛️</text>
    <text x="450" y="345" fill="#ffffff" font-size="9" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">OBJETIVO</text>

    <!-- Anillo 5 min: Hospital Nivel 1 -->
    <rect x="290" y="225" width="160" height="50" rx="8" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="1.8"/>
    <text x="370" y="245" fill="#ef4444" font-size="11" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">🏥 HOSPITAL NIVEL 1</text>
    <text x="370" y="262" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">&lt; 5 min • Trauma/Quirófano</text>

    <!-- Anillo 5 min: Comisaría Safe Spot -->
    <rect x="460" y="380" width="160" height="50" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="540" y="400" fill="#38bdf8" font-size="11" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">👮 LUGAR SEGURO</text>
    <text x="540" y="417" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">&lt; 5 min • Cuartel/Comisaría</text>

    <!-- Anillo 10 min: Helipuerto ZAE -->
    <rect x="620" y="210" width="170" height="55" rx="8" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.8"/>
    <text x="705" y="232" fill="#34d399" font-size="11" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">🚁 HELIPUERTO / ZAE</text>
    <text x="705" y="250" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">&lt; 10 min • Evacuación aérea</text>

    <text x="450" y="475" fill="#cbd5e1" font-size="12" font-family="'Inter', sans-serif" font-weight="600" text-anchor="middle">
      "La Avanzada debe tener enlaces telefónicos y frecuencias directas con el médico de guardia de turno"
    </text>
  </svg>