<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
    
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001433"/>
      <stop offset="35%" stop-color="#002C66"/>
      <stop offset="70%" stop-color="#003273"/>
      <stop offset="100%" stop-color="#001a40"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#FFB515"/>
      <stop offset="100%" stop-color="#C28600"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0069F2"/>
      <stop offset="100%" stop-color="#004DB3"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0, 50, 115, 0.9)"/>
      <stop offset="100%" stop-color="rgba(0, 26, 64, 0.9)"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 105, 242, 0.12)" stroke-width="1"/>
    </pattern>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#FFB515" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0069F2" />
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
    
  <!-- Background -->
  <rect width="900" height="520" fill="url(#bgGrad)"/>
  <rect width="900" height="520" fill="url(#grid)"/>

  <!-- Tactical Borders -->
  <rect x="20" y="20" width="860" height="480" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.85"/>
  <rect x="30" y="30" width="840" height="460" rx="12" fill="none" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1"/>

  <!-- Corner Brackets -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 70 L 860 40 L 830 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 40 450 L 40 480 L 70 480" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 450 L 860 480 L 830 480" fill="none" stroke="#FFB515" stroke-width="3"/>

  <!-- Header Badge -->
  <rect x="230" y="45" width="440" height="30" rx="15" fill="rgba(0, 44, 102, 0.95)" stroke="#004DB3" stroke-width="1.5"/>
  <text x="450" y="65" fill="#FFB515" font-size="12" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="2.5" text-anchor="middle">
    POLICÍA DE TIERRA DEL FUEGO • FILOSOFÍA OPERATIVA
  </text>

  <!-- Title & Subtitle -->
  <text x="450" y="112" fill="#ffffff" font-size="24" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle" letter-spacing="0.5">
    PREVENCIÓN SOBRE REACCIÓN
  </text>
  <text x="450" y="138" fill="#7FB3FF" font-size="14" font-family="'Inter', sans-serif" font-weight="500" text-anchor="middle">
    Los Tres Pilares del Grupo de Protección: Planificación, Prevención y Secreto
  </text>

  <line x1="200" y1="155" x2="430" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  <polygon points="450,150 457,155 450,160 443,155" fill="#FFB515"/>
  <line x1="470" y1="155" x2="700" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  

    <rect x="70" y="190" width="230" height="260" rx="12" fill="url(#cardGrad)" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
    <circle cx="185" cy="245" r="28" fill="#001f48" stroke="#0069F2" stroke-width="2"/>
    <text x="185" y="254" font-size="22" text-anchor="middle">📐</text>
    <text x="185" y="295" fill="#ffffff" font-size="17" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">1. PLANIFICACIÓN</text>
    <line x1="100" y1="310" x2="270" y2="310" stroke="rgba(255,255,255,0.1)"/>
    <text x="185" y="335" fill="#cbd5e1" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">La improvisación es el</text>
    <text x="185" y="355" fill="#cbd5e1" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">peor enemigo de la seguridad.</text>
    <text x="185" y="385" fill="#7FB3FF" font-size="12" font-family="'Inter', sans-serif" font-weight="600" text-anchor="middle">• RECCE de terreno</text>
    <text x="185" y="405" fill="#7FB3FF" font-size="12" font-family="'Inter', sans-serif" font-weight="600" text-anchor="middle">• Rutas y contingencias</text>

    <rect x="335" y="180" width="230" height="280" rx="14" fill="url(#cardGrad)" stroke="#FFB515" stroke-width="2.5" filter="url(#glow)"/>
    <circle cx="450" cy="240" r="32" fill="#002C66" stroke="#FFB515" stroke-width="2.5"/>
    <text x="450" y="250" font-size="24" text-anchor="middle">🛡️</text>
    <text x="450" y="295" fill="#FFB515" font-size="18" font-family="'Outfit', sans-serif" font-weight="900" text-anchor="middle">2. PREVENCIÓN</text>
    <line x1="365" y1="310" x2="535" y2="310" stroke="rgba(255,181,21,0.3)"/>
    <text x="450" y="335" fill="#ffffff" font-size="13" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">"El custodio no reacciona:</text>
    <text x="450" y="355" fill="#FFB515" font-size="13" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">SE ANTICIPA"</text>
    <text x="450" y="388" fill="#cbd5e1" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">• Detección temprana</text>
    <text x="450" y="408" fill="#cbd5e1" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">• Neutralización a distancia</text>
    <text x="450" y="435" fill="#34d399" font-size="11" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">NÚCLEO DOCTRINAL</text>

    <rect x="600" y="190" width="230" height="260" rx="12" fill="url(#cardGrad)" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
    <circle cx="715" cy="245" r="28" fill="#001f48" stroke="#0069F2" stroke-width="2"/>
    <text x="715" y="254" font-size="22" text-anchor="middle">🤫</text>
    <text x="715" y="295" fill="#ffffff" font-size="17" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">3. SECRETO</text>
    <line x1="630" y1="310" x2="800" y2="310" stroke="rgba(255,255,255,0.1)"/>
    <text x="715" y="335" fill="#cbd5e1" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">La confidencialidad como</text>
    <text x="715" y="355" fill="#cbd5e1" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">arma táctica esencial.</text>
    <text x="715" y="385" fill="#7FB3FF" font-size="12" font-family="'Inter', sans-serif" font-weight="600" text-anchor="middle">• Negación de itinerarios</text>
    <text x="715" y="405" fill="#7FB3FF" font-size="12" font-family="'Inter', sans-serif" font-weight="600" text-anchor="middle">• Comunicaciones seguras</text>

    <rect x="150" y="475" width="600" height="28" rx="6" fill="rgba(0, 44, 102, 0.8)"/>
    <text x="450" y="494" fill="#cbd5e1" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">
      "La mejor batalla ganada por la custodia es aquella que nunca llegó a suceder."
    </text>
  </svg>