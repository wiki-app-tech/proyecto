<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
    
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001433"/>
      <stop offset="35%" stop-color="#002C66"/>
      <stop offset="70%" stop-color="#003273"/>
      <stop offset="100%" stop-color="#001a40"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#FFB515"/>
      <stop offset="100%" stop-color="#C28600"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0069F2"/>
      <stop offset="100%" stop-color="#004DB3"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0, 50, 115, 0.9)"/>
      <stop offset="100%" stop-color="rgba(0, 26, 64, 0.9)"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 105, 242, 0.12)" stroke-width="1"/>
    </pattern>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#FFB515" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0069F2" />
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
    
  <!-- Background -->
  <rect width="900" height="500" fill="url(#bgGrad)"/>
  <rect width="900" height="500" fill="url(#grid)"/>

  <!-- Tactical Borders -->
  <rect x="20" y="20" width="860" height="460" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.85"/>
  <rect x="30" y="30" width="840" height="440" rx="12" fill="none" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1"/>

  <!-- Corner Brackets -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 70 L 860 40 L 830 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 40 430 L 40 460 L 70 460" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 430 L 860 460 L 830 460" fill="none" stroke="#FFB515" stroke-width="3"/>

  <!-- Header Badge -->
  <rect x="230" y="45" width="440" height="30" rx="15" fill="rgba(0, 44, 102, 0.95)" stroke="#004DB3" stroke-width="1.5"/>
  <text x="450" y="65" fill="#FFB515" font-size="12" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="2.5" text-anchor="middle">
    POLICÍA DE TIERRA DEL FUEGO • RECONOCIMIENTO INTERNO
  </text>

  <!-- Title & Subtitle -->
  <text x="450" y="112" fill="#ffffff" font-size="24" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle" letter-spacing="0.5">
    INTERIOR DEL OBJETIVO: FLUJO DE CIRCULACIÓN Y COORDINACIÓN
  </text>
  <text x="450" y="138" fill="#7FB3FF" font-size="14" font-family="'Inter', sans-serif" font-weight="500" text-anchor="middle">
    El Recorrido Pedestre del Dignatario: De Entrada a Estrado
  </text>

  <line x1="200" y1="155" x2="430" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  <polygon points="450,150 457,155 450,160 443,155" fill="#FFB515"/>
  <line x1="470" y1="155" x2="700" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  

    <!-- 4 Linear Steps -->
    <rect x="50" y="200" width="180" height="220" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.8"/>
    <circle cx="140" cy="245" r="22" fill="#001f48" stroke="#38bdf8" stroke-width="2"/>
    <text x="140" y="252" font-size="18" text-anchor="middle">🚪</text>
    <text x="140" y="290" fill="#38bdf8" font-size="13" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">1. ACCESO</text>
    <text x="140" y="315" fill="#ffffff" font-size="11" font-family="'Inter', sans-serif" font-weight="600" text-anchor="middle">Entrada Principal</text>
    <text x="140" y="340" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Puerta de doble hoja</text>
    <text x="140" y="360" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Detección de metales</text>
    <text x="140" y="380" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Transición de luz</text>

    <!-- Arrow 1 to 2 -->
    <path d="M 235 310 L 260 310" stroke="#FFB515" stroke-width="2.5" marker-end="url(#arrowGold)"/>

    <rect x="265" y="200" width="180" height="220" rx="10" fill="url(#cardGrad)" stroke="#FFB515" stroke-width="1.8"/>
    <circle cx="355" cy="245" r="22" fill="#002C66" stroke="#FFB515" stroke-width="2"/>
    <text x="355" y="252" font-size="18" text-anchor="middle">🏛️</text>
    <text x="355" y="290" fill="#FFB515" font-size="13" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">2. HALL DE ACCESO</text>
    <text x="355" y="315" fill="#ffffff" font-size="11" font-family="'Inter', sans-serif" font-weight="600" text-anchor="middle">Recepción Protocolar</text>
    <text x="355" y="340" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Saludo autoridades</text>
    <text x="355" y="360" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Flujo sin detención</text>
    <text x="355" y="380" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Fotógrafos acreditados</text>

    <!-- Arrow 2 to 3 -->
    <path d="M 450 310 L 475 310" stroke="#FFB515" stroke-width="2.5" marker-end="url(#arrowGold)"/>

    <rect x="480" y="200" width="180" height="220" rx="10" fill="url(#cardGrad)" stroke="#a78bfa" stroke-width="1.8"/>
    <circle cx="570" cy="245" r="22" fill="#001f48" stroke="#a78bfa" stroke-width="2"/>
    <text x="570" y="252" font-size="18" text-anchor="middle">👥</text>
    <text x="570" y="290" fill="#a78bfa" font-size="13" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">3. SALÓN PRINCIPAL</text>
    <text x="570" y="315" fill="#ffffff" font-size="11" font-family="'Inter', sans-serif" font-weight="600" text-anchor="middle">Público y Medios</text>
    <text x="570" y="340" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Pasillo central libre</text>
    <text x="570" y="360" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Cordón de separación</text>
    <text x="570" y="380" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Salidas laterales</text>

    <!-- Arrow 3 to 4 -->
    <path d="M 665 310 L 690 310" stroke="#FFB515" stroke-width="2.5" marker-end="url(#arrowGold)"/>

    <rect x="695" y="200" width="155" height="220" rx="10" fill="url(#cardGrad)" stroke="#34d399" stroke-width="2" filter="url(#glow)"/>
    <circle cx="772" cy="245" r="22" fill="#001f48" stroke="#34d399" stroke-width="2"/>
    <text x="772" y="252" font-size="18" text-anchor="middle">🎤</text>
    <text x="772" y="290" fill="#34d399" font-size="13" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">4. EL ESTRADO</text>
    <text x="772" y="315" fill="#ffffff" font-size="11" font-family="'Inter', sans-serif" font-weight="600" text-anchor="middle">Discurso del VIP</text>
    <text x="772" y="340" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Jefe en flanco ciego</text>
    <text x="772" y="360" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Espalda asegurada</text>
    <text x="772" y="380" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Puerta trasera abierta</text>

    <text x="450" y="465" fill="#cbd5e1" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">
      "Todo el recorrido debe tener iluminación, llaves de paso libres y puertas no trabadas"
    </text>
  </svg>