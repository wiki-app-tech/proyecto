<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
    
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001433"/>
      <stop offset="35%" stop-color="#002C66"/>
      <stop offset="70%" stop-color="#003273"/>
      <stop offset="100%" stop-color="#001a40"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#FFB515"/>
      <stop offset="100%" stop-color="#C28600"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0069F2"/>
      <stop offset="100%" stop-color="#004DB3"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0, 50, 115, 0.9)"/>
      <stop offset="100%" stop-color="rgba(0, 26, 64, 0.9)"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 105, 242, 0.12)" stroke-width="1"/>
    </pattern>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#FFB515" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0069F2" />
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
    
  <!-- Background -->
  <rect width="900" height="500" fill="url(#bgGrad)"/>
  <rect width="900" height="500" fill="url(#grid)"/>

  <!-- Tactical Borders -->
  <rect x="20" y="20" width="860" height="460" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.85"/>
  <rect x="30" y="30" width="840" height="440" rx="12" fill="none" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1"/>

  <!-- Corner Brackets -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 70 L 860 40 L 830 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 40 430 L 40 460 L 70 460" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 430 L 860 460 L 830 460" fill="none" stroke="#FFB515" stroke-width="3"/>

  <!-- Header Badge -->
  <rect x="230" y="45" width="440" height="30" rx="15" fill="rgba(0, 44, 102, 0.95)" stroke="#004DB3" stroke-width="1.5"/>
  <text x="450" y="65" fill="#FFB515" font-size="12" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="2.5" text-anchor="middle">
    POLICÍA DE TIERRA DEL FUEGO • INSTALACIONES CRÍTICAS
  </text>

  <!-- Title & Subtitle -->
  <text x="450" y="112" fill="#ffffff" font-size="24" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle" letter-spacing="0.5">
    CONTROL DE INFRAESTRUCTURA CRÍTICA EN EL EMPLAZAMIENTO
  </text>
  <text x="450" y="138" fill="#7FB3FF" font-size="14" font-family="'Inter', sans-serif" font-weight="500" text-anchor="middle">
    Los Cuatro Puntos Físicos que la Avanzada Debe Asegurar y Custodiar
  </text>

  <line x1="200" y1="155" x2="430" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  <polygon points="450,150 457,155 450,160 443,155" fill="#FFB515"/>
  <line x1="470" y1="155" x2="700" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  

    <!-- 4 Cards -->
    <rect x="50" y="190" width="180" height="240" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.8"/>
    <circle cx="140" cy="240" r="24" fill="#001f48" stroke="#38bdf8" stroke-width="2"/>
    <text x="140" y="248" font-size="20" text-anchor="middle">🚻</text>
    <text x="140" y="285" fill="#38bdf8" font-size="14" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">CUARTOS ASEO</text>
    <text x="140" y="310" fill="#ffffff" font-size="11" font-family="'Inter', sans-serif" font-weight="600" text-anchor="middle">Sanitarios VIP</text>
    <text x="140" y="335" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Revisión de cisternas</text>
    <text x="140" y="355" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Detección de cámaras</text>
    <text x="140" y="375" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Cierre con llave previa</text>
    <text x="140" y="395" fill="#38bdf8" font-size="10" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">Uso exclusivo dignatario</text>

    <rect x="255" y="190" width="180" height="240" rx="10" fill="url(#cardGrad)" stroke="#FFB515" stroke-width="1.8"/>
    <circle cx="345" cy="240" r="24" fill="#002C66" stroke="#FFB515" stroke-width="2"/>
    <text x="345" y="248" font-size="20" text-anchor="middle">🔑</text>
    <text x="345" y="285" fill="#FFB515" font-size="14" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">LLAVES MAESTRAS</text>
    <text x="345" y="310" fill="#ffffff" font-size="11" font-family="'Inter', sans-serif" font-weight="600" text-anchor="middle">Acceso Irrestricto</text>
    <text x="345" y="335" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Llaves físicas y tarjetas</text>
    <text x="345" y="355" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• En poder del Custodio Av.</text>
    <text x="345" y="375" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Puertas de emergencia</text>
    <text x="345" y="395" fill="#FFB515" font-size="10" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">Cero demoras en escape</text>

    <rect x="460" y="190" width="180" height="240" rx="10" fill="url(#cardGrad)" stroke="#a78bfa" stroke-width="1.8"/>
    <circle cx="550" cy="240" r="24" fill="#001f48" stroke="#a78bfa" stroke-width="2"/>
    <text x="550" y="248" font-size="20" text-anchor="middle">🎧</text>
    <text x="550" y="285" fill="#a78bfa" font-size="14" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">P. COMANDO</text>
    <text x="550" y="310" fill="#ffffff" font-size="11" font-family="'Inter', sans-serif" font-weight="600" text-anchor="middle">Base de Operaciones</text>
    <text x="550" y="335" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Repetidoras VHF/UHF</text>
    <text x="550" y="355" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Monitoreo CCTV edificio</text>
    <text x="550" y="375" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Enlace con Base Central</text>
    <text x="550" y="395" fill="#a78bfa" font-size="10" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">Líneas fijas y radio</text>

    <rect x="665" y="190" width="185" height="240" rx="10" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.8"/>
    <circle cx="757" cy="240" r="24" fill="#001f48" stroke="#34d399" stroke-width="2"/>
    <text x="757" y="248" font-size="20" text-anchor="middle">🛏️</text>
    <text x="757" y="285" fill="#34d399" font-size="14" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">DESCANSO VIP</text>
    <text x="757" y="310" fill="#ffffff" font-size="11" font-family="'Inter', sans-serif" font-weight="600" text-anchor="middle">Sala Privada Limpia</text>
    <text x="757" y="335" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Perímetro estéril</text>
    <text x="757" y="355" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Alimentos sellados</text>
    <text x="757" y="375" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Conexión al Cuarto Seg.</text>
    <text x="757" y="395" fill="#34d399" font-size="10" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">Custodio permanente</text>

    <text x="450" y="465" fill="#cbd5e1" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">
      "Si una puerta no abre al primer intento, la evacuación falla. Las llaves se prueban todas"
    </text>
  </svg>