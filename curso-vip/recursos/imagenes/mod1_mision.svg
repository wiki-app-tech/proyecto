<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540">
    
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001433"/>
      <stop offset="35%" stop-color="#002C66"/>
      <stop offset="70%" stop-color="#003273"/>
      <stop offset="100%" stop-color="#001a40"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#FFB515"/>
      <stop offset="100%" stop-color="#C28600"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0069F2"/>
      <stop offset="100%" stop-color="#004DB3"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0, 50, 115, 0.9)"/>
      <stop offset="100%" stop-color="rgba(0, 26, 64, 0.9)"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 105, 242, 0.12)" stroke-width="1"/>
    </pattern>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#FFB515" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0069F2" />
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
    
  <!-- Background -->
  <rect width="900" height="540" fill="url(#bgGrad)"/>
  <rect width="900" height="540" fill="url(#grid)"/>

  <!-- Tactical Borders -->
  <rect x="20" y="20" width="860" height="500" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.85"/>
  <rect x="30" y="30" width="840" height="480" rx="12" fill="none" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1"/>

  <!-- Corner Brackets -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 70 L 860 40 L 830 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 40 470 L 40 500 L 70 500" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 470 L 860 500 L 830 500" fill="none" stroke="#FFB515" stroke-width="3"/>

  <!-- Header Badge -->
  <rect x="230" y="45" width="440" height="30" rx="15" fill="rgba(0, 44, 102, 0.95)" stroke="#004DB3" stroke-width="1.5"/>
  <text x="450" y="65" fill="#FFB515" font-size="12" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="2.5" text-anchor="middle">
    POLICÍA DE TIERRA DEL FUEGO • DOCTRINA FUNDAMENTAL
  </text>

  <!-- Title & Subtitle -->
  <text x="450" y="112" fill="#ffffff" font-size="24" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle" letter-spacing="0.5">
    LA MISIÓN: PROTECCIÓN DE LA INVESTIDURA
  </text>
  <text x="450" y="138" fill="#7FB3FF" font-size="14" font-family="'Inter', sans-serif" font-weight="500" text-anchor="middle">
    Diferenciación entre cuerpo físico e investidura democrática del Estado
  </text>

  <line x1="200" y1="155" x2="430" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  <polygon points="450,150 457,155 450,160 443,155" fill="#FFB515"/>
  <line x1="470" y1="155" x2="700" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  

    <rect x="70" y="190" width="340" height="270" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <rect x="70" y="190" width="340" height="40" rx="14" fill="#001f48"/>
    <text x="240" y="216" fill="#cbd5e1" font-size="15" font-family="'Outfit', sans-serif" font-weight="700" text-anchor="middle">SEGURIDAD CONVENCIONAL</text>
    
    <circle cx="240" cy="285" r="34" fill="#002C66" stroke="#004DB3" stroke-width="2"/>
    <text x="240" y="293" fill="#cbd5e1" font-size="26" text-anchor="middle">👤</text>
    <text x="240" y="340" fill="#ffffff" font-size="16" font-family="'Outfit', sans-serif" font-weight="700" text-anchor="middle">Cuerpo Físico / Individuo</text>
    <text x="240" y="365" fill="#94a3b8" font-size="13" font-family="'Inter', sans-serif" text-anchor="middle">Patrimonio privado • Bien personal</text>
    <text x="240" y="390" fill="#94a3b8" font-size="13" font-family="'Inter', sans-serif" text-anchor="middle">Respuesta reactiva ante agresión</text>
    <text x="240" y="425" fill="#f87171" font-size="12" font-family="'Inter', sans-serif" font-weight="600" text-anchor="middle">⚠️ Enfoque comercial limitado</text>

    <path d="M 430 325 L 470 325" stroke="#FFB515" stroke-width="3" marker-end="url(#arrowGold)"/>

    <rect x="490" y="190" width="340" height="270" rx="14" fill="url(#cardGrad)" stroke="rgba(255,181,21,0.5)" stroke-width="2"/>
    <rect x="490" y="190" width="340" height="40" rx="14" fill="#002C66"/>
    <text x="660" y="216" fill="#FFB515" font-size="15" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">CUSTODIA VIP POLICIAL</text>
    
    <circle cx="660" cy="285" r="34" fill="#003273" stroke="#FFB515" stroke-width="2.5" filter="url(#glow)"/>
    <text x="660" y="293" fill="#FFB515" font-size="26" text-anchor="middle">🏛️</text>
    <text x="660" y="340" fill="#FFB515" font-size="16" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">Investidura y Función del Estado</text>
    <text x="660" y="365" fill="#ffffff" font-size="13" font-family="'Inter', sans-serif" text-anchor="middle">Gobernabilidad • Sistema Institucional</text>
    <text x="660" y="390" fill="#7FB3FF" font-size="13" font-family="'Inter', sans-serif" text-anchor="middle">Doctrina preventiva y anticipatoria</text>
    <text x="660" y="425" fill="#34d399" font-size="12" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">🛡️ Misión de Estado y Soberanía</text>

    <rect x="150" y="480" width="600" height="32" rx="8" fill="rgba(0, 31, 72, 0.7)" stroke="#004DB3" stroke-width="1"/>
    <text x="450" y="501" fill="#cbd5e1" font-size="12" font-family="'Inter', sans-serif" font-weight="600" text-anchor="middle">
      "No protegemos a la persona por su estatus, sino por la función pública que encarna"
    </text>
  </svg>