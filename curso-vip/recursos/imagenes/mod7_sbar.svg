<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
    
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001433"/>
      <stop offset="35%" stop-color="#002C66"/>
      <stop offset="70%" stop-color="#003273"/>
      <stop offset="100%" stop-color="#001a40"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#FFB515"/>
      <stop offset="100%" stop-color="#C28600"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0069F2"/>
      <stop offset="100%" stop-color="#004DB3"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0, 50, 115, 0.9)"/>
      <stop offset="100%" stop-color="rgba(0, 26, 64, 0.9)"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 105, 242, 0.12)" stroke-width="1"/>
    </pattern>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#FFB515" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0069F2" />
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
    
  <!-- Background -->
  <rect width="900" height="500" fill="url(#bgGrad)"/>
  <rect width="900" height="500" fill="url(#grid)"/>

  <!-- Tactical Borders -->
  <rect x="20" y="20" width="860" height="460" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.85"/>
  <rect x="30" y="30" width="840" height="440" rx="12" fill="none" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1"/>

  <!-- Corner Brackets -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 70 L 860 40 L 830 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 40 430 L 40 460 L 70 460" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 430 L 860 460 L 830 460" fill="none" stroke="#FFB515" stroke-width="3"/>

  <!-- Header Badge -->
  <rect x="230" y="45" width="440" height="30" rx="15" fill="rgba(0, 44, 102, 0.95)" stroke="#004DB3" stroke-width="1.5"/>
  <text x="450" y="65" fill="#FFB515" font-size="12" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="2.5" text-anchor="middle">
    POLICÍA DE TIERRA DEL FUEGO • COMUNICACIÓN EN CRISIS
  </text>

  <!-- Title & Subtitle -->
  <text x="450" y="112" fill="#ffffff" font-size="24" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle" letter-spacing="0.5">
    REPORTE SBAR Y TRANSFERENCIA MÉDICA TÁCTICA
  </text>
  <text x="450" y="138" fill="#7FB3FF" font-size="14" font-family="'Inter', sans-serif" font-weight="500" text-anchor="middle">
    Coordinación con el 107/SEM y la Figura Clave del "Puntero de Recepción"
  </text>

  <line x1="200" y1="155" x2="430" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  <polygon points="450,150 457,155 450,160 443,155" fill="#FFB515"/>
  <line x1="470" y1="155" x2="700" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  

    <!-- Left Box: SBAR Report -->
    <rect x="70" y="190" width="350" height="240" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2"/>
    <rect x="70" y="190" width="350" height="40" rx="12" fill="#002C66"/>
    <text x="245" y="216" fill="#38bdf8" font-size="14" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">REPORTE MÉDICO SBAR (VHF / 107)</text>

    <text x="95" y="255" fill="#FFB515" font-size="12" font-family="'Inter', sans-serif" font-weight="700">S - Situación:</text>
    <text x="115" y="272" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">Edad, sexo y tipo de lesión (disparo / paro cardíaco).</text>

    <text x="95" y="295" fill="#FFB515" font-size="12" font-family="'Inter', sans-serif" font-weight="700">B - Background (Antecedentes):</text>
    <text x="115" y="312" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">Hora del incidente y pérdida estimada de sangre.</text>

    <text x="95" y="335" fill="#FFB515" font-size="12" font-family="'Inter', sans-serif" font-weight="700">A - Assessment (Evaluación):</text>
    <text x="115" y="352" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">Signos vitales: Inconsciente / 1 descarga de DEA.</text>

    <text x="95" y="375" fill="#FFB515" font-size="12" font-family="'Inter', sans-serif" font-weight="700">R - Recomendación / Requerimiento:</text>
    <text x="115" y="392" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">Ambulancia UTIM con médico en Punto de Acceso.</text>

    <!-- Right Box: Puntero de Recepción -->
    <rect x="480" y="190" width="350" height="240" rx="12" fill="url(#cardGrad)" stroke="#34d399" stroke-width="2" filter="url(#glow)"/>
    <rect x="480" y="190" width="350" height="40" rx="12" fill="#064e3b"/>
    <text x="655" y="216" fill="#a7f3d0" font-size="14" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">EL "PUNTERO DE RECEPCIÓN"</text>

    <circle cx="655" cy="275" r="26" fill="#001f48" stroke="#34d399" stroke-width="2"/>
    <text x="655" y="283" font-size="20" text-anchor="middle">👮</text>
    <text x="655" y="320" fill="#ffffff" font-size="12" font-family="'Outfit', sans-serif" font-weight="700" text-anchor="middle">Custodio de Avanzada en Anillo Exterior</text>
    <text x="505" y="345" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">• Intercepta a la ambulancia en la vía pública</text>
    <text x="505" y="365" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">• Identifica al personal médico (evita intrusos)</text>
    <text x="505" y="385" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">• Guía el móvil médico por ruta segura al VIP</text>
    <text x="655" y="413" fill="#34d399" font-size="11" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">LA CÁPSULA NUNCA SE ABRE SIN CONTROL</text>

    <text x="450" y="465" fill="#cbd5e1" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">
      "La ambulancia jamás ingresa al dispositivo sin haber sido verificada por el Puntero de Recepción"
    </text>
  </svg>