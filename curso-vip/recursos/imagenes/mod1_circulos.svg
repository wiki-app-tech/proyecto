<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001433"/>
      <stop offset="50%" stop-color="#002C66"/>
      <stop offset="100%" stop-color="#001a40"/>
    </linearGradient>
    <linearGradient id="ring3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(0, 77, 179, 0.2)"/>
      <stop offset="100%" stop-color="rgba(0, 105, 242, 0.25)"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="1000" fill="url(#bg)"/>
  <rect x="24" y="24" width="952" height="952" rx="20" fill="none" stroke="#004DB3" stroke-width="2"/>

  <!-- Title Header -->
  <text x="500" y="70" fill="#FFB515" font-size="24" font-family="'Outfit', sans-serif" font-weight="900" text-anchor="middle" letter-spacing="2">
    TEORÍA DE CÍRCULOS CONCÉNTRICOS DE PROTECCIÓN
  </text>
  <text x="500" y="96" fill="#cbd5e1" font-size="13" font-family="'Inter', sans-serif" text-anchor="middle">
    Doctrina de Seguridad en Profundidad • Tres Anillos de Blindaje Progresivo
  </text>
  <line x1="150" y1="115" x2="850" y2="115" stroke="#004DB3" stroke-width="1.5"/>

  <!-- RINGS CENTER AT (500, 520) -->
  <g transform="translate(500, 520)">
    <!-- ANILLO 3: EXTERIOR -->
    <circle cx="0" cy="0" r="360" fill="url(#ring3)" stroke="#0069F2" stroke-width="3"/>
    <circle cx="0" cy="0" r="360" fill="none" stroke="#FFB515" stroke-width="1.5" stroke-dasharray="8,6"/>

    <!-- ANILLO 2: MEDIO -->
    <circle cx="0" cy="0" r="240" fill="rgba(0, 50, 115, 0.45)" stroke="#004DB3" stroke-width="3"/>
    <circle cx="0" cy="0" r="240" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- ANILLO 1: INTERIOR -->
    <circle cx="0" cy="0" r="130" fill="rgba(0, 77, 179, 0.65)" stroke="#FFB515" stroke-width="3.5"/>

    <!-- DIGNATARIO (CENTRAL) -->
    <circle cx="0" cy="0" r="45" fill="#FFB515" stroke="#ffffff" stroke-width="3"/>
    <text x="0" y="6" fill="#000000" font-size="18" font-family="'Outfit', sans-serif" font-weight="900" text-anchor="middle">VIP</text>
    <text x="0" y="24" fill="#000000" font-size="9" font-family="'Inter', sans-serif" font-weight="800" text-anchor="middle">DIGNATARIO</text>

    <!-- ANILLO INTERIOR LABELS -->
    <text x="0" y="-85" fill="#FFB515" font-size="13" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">
      ANILLO INTERIOR (CÁPSULA)
    </text>
    <text x="0" y="-68" fill="#ffffff" font-size="10" font-family="'Inter', sans-serif" font-weight="600" text-anchor="middle">
      Protección Física Inmediata • Escolta Directa
    </text>

    <!-- ANILLO MEDIO LABELS -->
    <text x="0" y="-195" fill="#ffffff" font-size="14" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">
      ANILLO MEDIO (INSTITUCIONAL / ACCESOS)
    </text>
    <text x="0" y="-175" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">
      Detectores de Metales • Acreditaciones • Guardia Táctica • Ambulancia
    </text>

    <!-- ANILLO EXTERIOR LABELS -->
    <text x="0" y="-315" fill="#0069F2" font-size="15" font-family="'Outfit', sans-serif" font-weight="900" text-anchor="middle">
      ANILLO EXTERIOR (PERÍMETRO Y TERRITORIO)
    </text>
    <text x="0" y="-295" fill="#cbd5e1" font-size="11.5" font-family="'Inter', sans-serif" text-anchor="middle">
      Inteligencia Previa • Drones • Patrullas Exteriores • Cortes de Tránsito
    </text>
  </g>

  <!-- Bottom Legend / Summary -->
  <g transform="translate(100, 915)">
    <rect x="0" y="0" width="800" height="42" rx="8" fill="#001a40" stroke="#004DB3" stroke-width="1.5"/>
    <text x="400" y="26" fill="#FFB515" font-size="11" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">
      MISION: CADA ANILLO DETIENE O RETARDA AMENAZAS PARA PERMITIR LA EVACUACIÓN DEL VIP
    </text>
  </g>
</svg>