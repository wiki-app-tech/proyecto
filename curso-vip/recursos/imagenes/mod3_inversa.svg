<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
    
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001433"/>
      <stop offset="35%" stop-color="#002C66"/>
      <stop offset="70%" stop-color="#003273"/>
      <stop offset="100%" stop-color="#001a40"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#FFB515"/>
      <stop offset="100%" stop-color="#C28600"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0069F2"/>
      <stop offset="100%" stop-color="#004DB3"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0, 50, 115, 0.9)"/>
      <stop offset="100%" stop-color="rgba(0, 26, 64, 0.9)"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 105, 242, 0.12)" stroke-width="1"/>
    </pattern>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#FFB515" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0069F2" />
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
    
  <!-- Background -->
  <rect width="900" height="500" fill="url(#bgGrad)"/>
  <rect width="900" height="500" fill="url(#grid)"/>

  <!-- Tactical Borders -->
  <rect x="20" y="20" width="860" height="460" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.85"/>
  <rect x="30" y="30" width="840" height="440" rx="12" fill="none" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1"/>

  <!-- Corner Brackets -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 70 L 860 40 L 830 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 40 430 L 40 460 L 70 460" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 430 L 860 460 L 830 460" fill="none" stroke="#FFB515" stroke-width="3"/>

  <!-- Header Badge -->
  <rect x="230" y="45" width="440" height="30" rx="15" fill="rgba(0, 44, 102, 0.95)" stroke="#004DB3" stroke-width="1.5"/>
  <text x="450" y="65" fill="#FFB515" font-size="12" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="2.5" text-anchor="middle">
    POLICÍA DE TIERRA DEL FUEGO • GESTIÓN DEL TIEMPO
  </text>

  <!-- Title & Subtitle -->
  <text x="450" y="112" fill="#ffffff" font-size="24" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle" letter-spacing="0.5">
    PLANIFICACIÓN INVERSA: GESTIÓN DEL TIEMPO OPERATIVO
  </text>
  <text x="450" y="138" fill="#7FB3FF" font-size="14" font-family="'Inter', sans-serif" font-weight="500" text-anchor="middle">
    Cálculo Regresivo desde el Evento (T=0) para Eliminar la Prisa y el Error
  </text>

  <line x1="200" y1="155" x2="430" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  <polygon points="450,150 457,155 450,160 443,155" fill="#FFB515"/>
  <line x1="470" y1="155" x2="700" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  

    <!-- Timeline Bar -->
    <rect x="70" y="270" width="760" height="12" rx="6" fill="#001433" stroke="#004DB3" stroke-width="1"/>
    
    <!-- Milestone T-4h -->
    <circle cx="100" cy="276" r="16" fill="#001f48" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="100" y="281" fill="#38bdf8" font-size="10" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">T-4h</text>
    <rect x="50" y="190" width="100" height="60" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="100" y="215" fill="#38bdf8" font-size="11" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">INICIO PREPAR.</text>
    <text x="100" y="235" fill="#cbd5e1" font-size="9" font-family="'Inter', sans-serif" text-anchor="middle">Revisión armas/móviles</text>

    <!-- Milestone T-2h -->
    <circle cx="310" cy="276" r="16" fill="#001f48" stroke="#FFB515" stroke-width="2.5"/>
    <text x="310" y="281" fill="#FFB515" font-size="10" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">T-2h</text>
    <rect x="260" y="310" width="100" height="60" rx="8" fill="url(#cardGrad)" stroke="#FFB515" stroke-width="1.5"/>
    <text x="310" y="335" fill="#FFB515" font-size="11" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">AVANZADA</text>
    <text x="310" y="355" fill="#cbd5e1" font-size="9" font-family="'Inter', sans-serif" text-anchor="middle">Requisa y Cuarto Seg.</text>

    <!-- Milestone T-1h -->
    <circle cx="510" cy="276" r="16" fill="#001f48" stroke="#a78bfa" stroke-width="2.5"/>
    <text x="510" y="281" fill="#a78bfa" font-size="10" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">T-1h</text>
    <rect x="460" y="190" width="100" height="60" rx="8" fill="url(#cardGrad)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="510" y="215" fill="#a78bfa" font-size="11" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">BRIEFING</text>
    <text x="510" y="235" fill="#cbd5e1" font-size="9" font-family="'Inter', sans-serif" text-anchor="middle">Orden OPORD y roles</text>

    <!-- Milestone T-30m -->
    <circle cx="680" cy="276" r="16" fill="#001f48" stroke="#facc15" stroke-width="2.5"/>
    <text x="680" y="281" fill="#facc15" font-size="10" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">T-30m</text>
    <rect x="630" y="310" width="100" height="60" rx="8" fill="url(#cardGrad)" stroke="#facc15" stroke-width="1.5"/>
    <text x="680" y="335" fill="#facc15" font-size="11" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">TRASLADO</text>
    <text x="680" y="355" fill="#cbd5e1" font-size="9" font-family="'Inter', sans-serif" text-anchor="middle">Convoy en movimiento</text>

    <!-- Milestone T=0 -->
    <circle cx="810" cy="276" r="18" fill="#002C66" stroke="#34d399" stroke-width="3" filter="url(#glow)"/>
    <text x="810" y="282" fill="#34d399" font-size="11" font-family="'Outfit', sans-serif" font-weight="900" text-anchor="middle">T=0</text>
    <rect x="750" y="190" width="120" height="60" rx="8" fill="url(#cardGrad)" stroke="#34d399" stroke-width="2"/>
    <text x="810" y="215" fill="#34d399" font-size="11" font-family="'Outfit', sans-serif" font-weight="900" text-anchor="middle">EVENTO VIP</text>
    <text x="810" y="235" fill="#ffffff" font-size="9" font-family="'Inter', sans-serif" text-anchor="middle">Arribo exacto a horario</text>

    <!-- Reverse Arrow -->
    <path d="M 810 400 L 100 400" stroke="#FFB515" stroke-width="2.5" marker-end="url(#arrowGold)"/>
    <text x="450" y="420" fill="#FFB515" font-size="12" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">
      ◀ SENTIDO DEL CÁLCULO MENTAL: Se fija T=0 y se descuentan los tiempos hacia atrás
    </text>

    <text x="450" y="465" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">
      "La prisa es la mayor generadora de brechas y accidentes en la cápsula. Con cálculo inverso nunca hay apuro"
    </text>
  </svg>