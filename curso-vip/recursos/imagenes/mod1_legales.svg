<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
    
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001433"/>
      <stop offset="35%" stop-color="#002C66"/>
      <stop offset="70%" stop-color="#003273"/>
      <stop offset="100%" stop-color="#001a40"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#FFB515"/>
      <stop offset="100%" stop-color="#C28600"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0069F2"/>
      <stop offset="100%" stop-color="#004DB3"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0, 50, 115, 0.9)"/>
      <stop offset="100%" stop-color="rgba(0, 26, 64, 0.9)"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 105, 242, 0.12)" stroke-width="1"/>
    </pattern>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#FFB515" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0069F2" />
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
    
  <!-- Background -->
  <rect width="900" height="500" fill="url(#bgGrad)"/>
  <rect width="900" height="500" fill="url(#grid)"/>

  <!-- Tactical Borders -->
  <rect x="20" y="20" width="860" height="460" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.85"/>
  <rect x="30" y="30" width="840" height="440" rx="12" fill="none" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1"/>

  <!-- Corner Brackets -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 70 L 860 40 L 830 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 40 430 L 40 460 L 70 460" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 430 L 860 460 L 830 460" fill="none" stroke="#FFB515" stroke-width="3"/>

  <!-- Header Badge -->
  <rect x="230" y="45" width="440" height="30" rx="15" fill="rgba(0, 44, 102, 0.95)" stroke="#004DB3" stroke-width="1.5"/>
  <text x="450" y="65" fill="#FFB515" font-size="12" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="2.5" text-anchor="middle">
    POLICÍA DE TIERRA DEL FUEGO • MARCO LEGAL
  </text>

  <!-- Title & Subtitle -->
  <text x="450" y="112" fill="#ffffff" font-size="24" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle" letter-spacing="0.5">
    PILARES LEGALES DE LA ACTUACIÓN POLICIAL
  </text>
  <text x="450" y="138" fill="#7FB3FF" font-size="14" font-family="'Inter', sans-serif" font-weight="500" text-anchor="middle">
    Límites normativos y sustento jurídico del accionar del personal de custodia
  </text>

  <line x1="200" y1="155" x2="430" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  <polygon points="450,150 457,155 450,160 443,155" fill="#FFB515"/>
  <line x1="470" y1="155" x2="700" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  

    <polygon points="450,185 640,430 260,430" fill="url(#cardGrad)" stroke="#FFB515" stroke-width="2"/>
    
    <!-- Level 1: Legalidad -->
    <polygon points="450,185 500,250 400,250" fill="rgba(255,181,21,0.25)" stroke="#FFB515" stroke-width="1.5"/>
    <text x="450" y="235" fill="#FFB515" font-size="14" font-family="'Outfit', sans-serif" font-weight="900" text-anchor="middle">LEGALIDAD</text>

    <!-- Level 2: Necesidad -->
    <polygon points="400,250 500,250 560,330 340,330" fill="rgba(0,105,242,0.25)" stroke="#0069F2" stroke-width="1.5"/>
    <text x="450" y="295" fill="#7FB3FF" font-size="14" font-family="'Outfit', sans-serif" font-weight="900" text-anchor="middle">NECESIDAD</text>
    <text x="450" y="315" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">Último recurso ante agresión</text>

    <!-- Level 3: Proporcionalidad -->
    <polygon points="340,330 560,330 630,425 270,425" fill="rgba(0,44,102,0.35)" stroke="#004DB3" stroke-width="1.5"/>
    <text x="450" y="375" fill="#ffffff" font-size="14" font-family="'Outfit', sans-serif" font-weight="900" text-anchor="middle">PROPORCIONALIDAD</text>
    <text x="450" y="398" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">Fuerza acorde y graduada a la amenaza</text>

    <!-- Side Explanations -->
    <rect x="660" y="230" width="180" height="85" rx="8" fill="url(#cardGrad)" stroke="rgba(0,105,242,0.4)" stroke-width="1"/>
    <text x="675" y="255" fill="#FFB515" font-size="12" font-family="'Outfit', sans-serif" font-weight="800">CÓDIGO PENAL</text>
    <text x="675" y="275" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">Art. 34 inc. 6 y 7:</text>
    <text x="675" y="295" fill="#7FB3FF" font-size="11" font-family="'Inter', sans-serif">Legítima defensa de 3ros.</text>

    <rect x="60" y="230" width="180" height="85" rx="8" fill="url(#cardGrad)" stroke="rgba(0,105,242,0.4)" stroke-width="1"/>
    <text x="75" y="255" fill="#FFB515" font-size="12" font-family="'Outfit', sans-serif" font-weight="800">CONSTITUCIÓN TDF</text>
    <text x="75" y="275" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">Res. 202/00-JP:</text>
    <text x="75" y="295" fill="#7FB3FF" font-size="11" font-family="'Inter', sans-serif">Doctrina de custodia oficial</text>

    <text x="450" y="465" fill="#cbd5e1" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">
      "El custodio profesional opera DENTRO de la ley; el guardaespaldas informal opera al margen de ella."
    </text>
  </svg>