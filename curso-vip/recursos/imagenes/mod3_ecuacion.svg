<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
    
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001433"/>
      <stop offset="35%" stop-color="#002C66"/>
      <stop offset="70%" stop-color="#003273"/>
      <stop offset="100%" stop-color="#001a40"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#FFB515"/>
      <stop offset="100%" stop-color="#C28600"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0069F2"/>
      <stop offset="100%" stop-color="#004DB3"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0, 50, 115, 0.9)"/>
      <stop offset="100%" stop-color="rgba(0, 26, 64, 0.9)"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 105, 242, 0.12)" stroke-width="1"/>
    </pattern>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#FFB515" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0069F2" />
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
    
  <!-- Background -->
  <rect width="900" height="500" fill="url(#bgGrad)"/>
  <rect width="900" height="500" fill="url(#grid)"/>

  <!-- Tactical Borders -->
  <rect x="20" y="20" width="860" height="460" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.85"/>
  <rect x="30" y="30" width="840" height="440" rx="12" fill="none" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1"/>

  <!-- Corner Brackets -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 70 L 860 40 L 830 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 40 430 L 40 460 L 70 460" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 430 L 860 460 L 830 460" fill="none" stroke="#FFB515" stroke-width="3"/>

  <!-- Header Badge -->
  <rect x="230" y="45" width="440" height="30" rx="15" fill="rgba(0, 44, 102, 0.95)" stroke="#004DB3" stroke-width="1.5"/>
  <text x="450" y="65" fill="#FFB515" font-size="12" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="2.5" text-anchor="middle">
    POLICÍA DE TIERRA DEL FUEGO • MATEMÁTICA OPERATIVA
  </text>

  <!-- Title & Subtitle -->
  <text x="450" y="112" fill="#ffffff" font-size="24" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle" letter-spacing="0.5">
    LA ECUACIÓN DEL RIESGO OPERATIVO
  </text>
  <text x="450" y="138" fill="#7FB3FF" font-size="14" font-family="'Inter', sans-serif" font-weight="500" text-anchor="middle">
    Amenaza Exógena × Vulnerabilidad Interna = Nivel de Riesgo
  </text>

  <line x1="200" y1="155" x2="430" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  <polygon points="450,150 457,155 450,160 443,155" fill="#FFB515"/>
  <line x1="470" y1="155" x2="700" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  

    <!-- 3 Formula Boxes -->
    <!-- Amenaza -->
    <rect x="60" y="190" width="220" height="230" rx="12" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="2"/>
    <circle cx="170" cy="245" r="26" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
    <text x="170" y="253" font-size="22" text-anchor="middle">⚠️</text>
    <text x="170" y="295" fill="#ef4444" font-size="16" font-family="'Outfit', sans-serif" font-weight="900" text-anchor="middle">AMENAZA</text>
    <text x="170" y="320" fill="#ffffff" font-size="11" font-family="'Inter', sans-serif" font-weight="600" text-anchor="middle">Factor Externo (Exógeno)</text>
    <text x="170" y="345" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• Agresor / Hostil</text>
    <text x="170" y="365" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• Manifestaciones / Clima</text>
    <text x="170" y="395" fill="#fca5a5" font-size="11" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">NO LA PODEMOS BORRAR</text>

    <!-- Multiplier Symbol -->
    <text x="310" y="315" fill="#FFB515" font-size="32" font-family="'Outfit', sans-serif" font-weight="900" text-anchor="middle">×</text>

    <!-- Vulnerabilidad -->
    <rect x="340" y="190" width="220" height="230" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="450" cy="245" r="26" fill="#001f48" stroke="#38bdf8" stroke-width="2"/>
    <text x="450" y="253" font-size="22" text-anchor="middle">🛡️</text>
    <text x="450" y="295" fill="#38bdf8" font-size="16" font-family="'Outfit', sans-serif" font-weight="900" text-anchor="middle">VULNERABILIDAD</text>
    <text x="450" y="320" fill="#ffffff" font-size="11" font-family="'Inter', sans-serif" font-weight="600" text-anchor="middle">Factor Interno (Propio)</text>
    <text x="450" y="345" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• Rutinas previsibles</text>
    <text x="450" y="365" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• Fallas de cápsula / brechas</text>
    <text x="450" y="395" fill="#34d399" font-size="11" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">¡LA REDUCIMOS A CERO!</text>

    <!-- Equals Symbol -->
    <text x="590" y="315" fill="#FFB515" font-size="32" font-family="'Outfit', sans-serif" font-weight="900" text-anchor="middle">=</text>

    <!-- Riesgo Result -->
    <rect x="620" y="190" width="220" height="230" rx="12" fill="url(#cardGrad)" stroke="#FFB515" stroke-width="2.5" filter="url(#glow)"/>
    <circle cx="730" cy="245" r="26" fill="#002C66" stroke="#FFB515" stroke-width="2"/>
    <text x="730" y="253" font-size="22" text-anchor="middle">🎯</text>
    <text x="730" y="295" fill="#FFB515" font-size="16" font-family="'Outfit', sans-serif" font-weight="900" text-anchor="middle">RIESGO TÁCTICO</text>
    <text x="730" y="320" fill="#ffffff" font-size="11" font-family="'Inter', sans-serif" font-weight="600" text-anchor="middle">Probabilidad Real de Daño</text>
    <text x="730" y="345" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• Si Vulnerabilidad = 0</text>
    <text x="730" y="365" fill="#34d399" font-size="12" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">➜ RIESGO = 0</text>
    <text x="730" y="395" fill="#FFB515" font-size="11" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">ÉXITO DE LA CUSTODIA</text>

    <!-- Bottom principle -->
    <rect x="100" y="445" width="700" height="28" rx="6" fill="rgba(0, 44, 102, 0.6)" stroke="#004DB3" stroke-width="1"/>
    <text x="450" y="464" fill="#cbd5e1" font-size="12" font-family="'Inter', sans-serif" font-weight="600" text-anchor="middle">
      Axioma Policial: "No podemos controlar al agresor, pero sí podemos blindar al 100% nuestro dispositivo"
    </text>
  </svg>