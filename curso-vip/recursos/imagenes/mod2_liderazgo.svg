<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
    
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001433"/>
      <stop offset="35%" stop-color="#002C66"/>
      <stop offset="70%" stop-color="#003273"/>
      <stop offset="100%" stop-color="#001a40"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#FFB515"/>
      <stop offset="100%" stop-color="#C28600"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0069F2"/>
      <stop offset="100%" stop-color="#004DB3"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0, 50, 115, 0.9)"/>
      <stop offset="100%" stop-color="rgba(0, 26, 64, 0.9)"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 105, 242, 0.12)" stroke-width="1"/>
    </pattern>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#FFB515" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0069F2" />
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
    
  <!-- Background -->
  <rect width="900" height="520" fill="url(#bgGrad)"/>
  <rect width="900" height="520" fill="url(#grid)"/>

  <!-- Tactical Borders -->
  <rect x="20" y="20" width="860" height="480" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.85"/>
  <rect x="30" y="30" width="840" height="460" rx="12" fill="none" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1"/>

  <!-- Corner Brackets -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 70 L 860 40 L 830 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 40 450 L 40 480 L 70 480" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 450 L 860 480 L 830 480" fill="none" stroke="#FFB515" stroke-width="3"/>

  <!-- Header Badge -->
  <rect x="230" y="45" width="440" height="30" rx="15" fill="rgba(0, 44, 102, 0.95)" stroke="#004DB3" stroke-width="1.5"/>
  <text x="450" y="65" fill="#FFB515" font-size="12" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="2.5" text-anchor="middle">
    POLICÍA DE TIERRA DEL FUEGO • CADENA DE MANDO
  </text>

  <!-- Title & Subtitle -->
  <text x="450" y="112" fill="#ffffff" font-size="24" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle" letter-spacing="0.5">
    EL NÚCLEO ESTRATÉGICO: LIDERAZGO Y MANDO
  </text>
  <text x="450" y="138" fill="#7FB3FF" font-size="14" font-family="'Inter', sans-serif" font-weight="500" text-anchor="middle">
    Estructura Tripartita de Dirección: División, Brigada y Avanzada
  </text>

  <line x1="200" y1="155" x2="430" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  <polygon points="450,150 457,155 450,160 443,155" fill="#FFB515"/>
  <line x1="470" y1="155" x2="700" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  

    <!-- Top: Jefe de División -->
    <rect x="275" y="180" width="350" height="95" rx="12" fill="url(#cardGrad)" stroke="#FFB515" stroke-width="2" filter="url(#glow)"/>
    <circle cx="320" cy="227" r="24" fill="#002C66" stroke="#FFB515" stroke-width="2"/>
    <text x="320" y="235" font-size="20" text-anchor="middle">👑</text>
    <text x="360" y="215" fill="#FFB515" font-size="15" font-family="'Outfit', sans-serif" font-weight="800">JEFE DE DIVISIÓN</text>
    <text x="360" y="235" fill="#ffffff" font-size="12" font-family="'Inter', sans-serif" font-weight="600">Planificación global y enlace político/institucional</text>
    <text x="360" y="255" fill="#7FB3FF" font-size="11" font-family="'Inter', sans-serif">Responsabilidad integral de la doctrina, personal y equipos</text>

    <!-- Branches -->
    <path d="M 450 275 L 450 310" stroke="#FFB515" stroke-width="2"/>
    <path d="M 230 310 L 670 310" stroke="#FFB515" stroke-width="2"/>
    <path d="M 230 310 L 230 340" stroke="#FFB515" stroke-width="2" marker-end="url(#arrowGold)"/>
    <path d="M 670 310 L 670 340" stroke="#FFB515" stroke-width="2" marker-end="url(#arrowGold)"/>

    <!-- Left: Jefe de Brigada -->
    <rect x="70" y="340" width="340" height="130" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.8"/>
    <circle cx="120" cy="390" r="24" fill="#001f48" stroke="#38bdf8" stroke-width="2"/>
    <text x="120" y="398" font-size="20" text-anchor="middle">🛡️</text>
    <text x="160" y="375" fill="#38bdf8" font-size="15" font-family="'Outfit', sans-serif" font-weight="800">JEFE DE BRIGADA (AIC)</text>
    <text x="160" y="398" fill="#ffffff" font-size="12" font-family="'Inter', sans-serif" font-weight="600">• Pegado al VIP como escudo humano</text>
    <text x="160" y="418" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">• Mando directo de la cápsula inmediata</text>
    <text x="160" y="438" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">• Decide evacuación inmediata ante amenaza</text>
    <text x="160" y="458" fill="#34d399" font-size="11" font-family="'Inter', sans-serif" font-weight="700">Comando en Movimiento Continuo</text>

    <!-- Right: Jefe de Avanzada -->
    <rect x="490" y="340" width="340" height="130" rx="12" fill="url(#cardGrad)" stroke="#a78bfa" stroke-width="1.8"/>
    <circle cx="540" cy="390" r="24" fill="#001f48" stroke="#a78bfa" stroke-width="2"/>
    <text x="540" y="398" font-size="20" text-anchor="middle">🗺️</text>
    <text x="580" y="375" fill="#a78bfa" font-size="15" font-family="'Outfit', sans-serif" font-weight="800">JEFE DE AVANZADA (RECCE)</text>
    <text x="580" y="398" fill="#ffffff" font-size="12" font-family="'Inter', sans-serif" font-weight="600">• Asesor táctico in situ previo al arribo</text>
    <text x="580" y="418" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">• Fija perímetros, rutas primarias y escape</text>
    <text x="580" y="438" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">• Asegura el Cuarto Seguro y zona estéril</text>
    <text x="580" y="458" fill="#FFB515" font-size="11" font-family="'Inter', sans-serif" font-weight="700">Inteligencia de Terreno y Desminado</text>
  </svg>