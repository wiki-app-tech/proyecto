<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
    
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001433"/>
      <stop offset="35%" stop-color="#002C66"/>
      <stop offset="70%" stop-color="#003273"/>
      <stop offset="100%" stop-color="#001a40"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#FFB515"/>
      <stop offset="100%" stop-color="#C28600"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0069F2"/>
      <stop offset="100%" stop-color="#004DB3"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0, 50, 115, 0.9)"/>
      <stop offset="100%" stop-color="rgba(0, 26, 64, 0.9)"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 105, 242, 0.12)" stroke-width="1"/>
    </pattern>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#FFB515" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0069F2" />
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
    
  <!-- Background -->
  <rect width="900" height="500" fill="url(#bgGrad)"/>
  <rect width="900" height="500" fill="url(#grid)"/>

  <!-- Tactical Borders -->
  <rect x="20" y="20" width="860" height="460" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.85"/>
  <rect x="30" y="30" width="840" height="440" rx="12" fill="none" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1"/>

  <!-- Corner Brackets -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 70 L 860 40 L 830 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 40 430 L 40 460 L 70 460" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 430 L 860 460 L 830 460" fill="none" stroke="#FFB515" stroke-width="3"/>

  <!-- Header Badge -->
  <rect x="230" y="45" width="440" height="30" rx="15" fill="rgba(0, 44, 102, 0.95)" stroke="#004DB3" stroke-width="1.5"/>
  <text x="450" y="65" fill="#FFB515" font-size="12" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="2.5" text-anchor="middle">
    POLICÍA DE TIERRA DEL FUEGO • RESPUESTA BAJO FUEGO
  </text>

  <!-- Title & Subtitle -->
  <text x="450" y="112" fill="#ffffff" font-size="24" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle" letter-spacing="0.5">
    LÍNEA DE TIEMPO DE REACCIÓN (4 FASES)
  </text>
  <text x="450" y="138" fill="#7FB3FF" font-size="14" font-family="'Inter', sans-serif" font-weight="500" text-anchor="middle">
    Protocolo de Respuesta Inmediata en los Primeros 0 a 5 Segundos
  </text>

  <line x1="200" y1="155" x2="430" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  <polygon points="450,150 457,155 450,160 443,155" fill="#FFB515"/>
  <line x1="470" y1="155" x2="700" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  

    <!-- 4 Phases -->
    <rect x="50" y="190" width="180" height="240" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.8"/>
    <circle cx="140" cy="235" r="22" fill="#001f48" stroke="#38bdf8" stroke-width="2"/>
    <text x="140" y="242" fill="#38bdf8" font-size="14" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">FASE 1</text>
    <text x="140" y="280" fill="#38bdf8" font-size="14" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">ALERTA VOCAL</text>
    <line x1="75" y1="295" x2="205" y2="295" stroke="rgba(255,255,255,0.1)"/>
    <text x="140" y="325" fill="#ffffff" font-size="12" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">Grito Direccional</text>
    <text x="140" y="350" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• Arma y posición horaria</text>
    <text x="140" y="375" fill="#fca5a5" font-size="12" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">"¡FUEGO A LAS 3!"</text>
    <text x="140" y="405" fill="#7FB3FF" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">Tiempo: 0 a 1 seg</text>

    <rect x="250" y="190" width="180" height="240" rx="12" fill="url(#cardGrad)" stroke="#FFB515" stroke-width="2" filter="url(#glow)"/>
    <circle cx="340" cy="235" r="22" fill="#002C66" stroke="#FFB515" stroke-width="2"/>
    <text x="340" y="242" fill="#FFB515" font-size="14" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">FASE 2</text>
    <text x="340" y="280" fill="#FFB515" font-size="14" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">ESCUDO FÍSICO</text>
    <line x1="275" y1="295" x2="405" y2="295" stroke="rgba(255,181,21,0.3)"/>
    <text x="340" y="325" fill="#ffffff" font-size="12" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">Jefe Salta al VIP</text>
    <text x="340" y="350" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• Barrera humana total</text>
    <text x="340" y="375" fill="#FFB515" font-size="11" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">Reduce la silueta</text>
    <text x="340" y="405" fill="#7FB3FF" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">Tiempo: 1 a 2 seg</text>

    <rect x="450" y="190" width="180" height="240" rx="12" fill="url(#cardGrad)" stroke="#34d399" stroke-width="2"/>
    <circle cx="540" cy="235" r="22" fill="#001f48" stroke="#34d399" stroke-width="2"/>
    <text x="540" y="242" fill="#34d399" font-size="14" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">FASE 3</text>
    <text x="540" y="280" fill="#34d399" font-size="14" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">EVACUACIÓN</text>
    <line x1="475" y1="295" x2="605" y2="295" stroke="rgba(255,255,255,0.1)"/>
    <text x="540" y="325" fill="#ffffff" font-size="12" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">Escape en Sentido Opuesto</text>
    <text x="540" y="350" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• Hacia Móvil A o Safe Room</text>
    <text x="540" y="375" fill="#34d399" font-size="11" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">Velocidad sobre fuego</text>
    <text x="540" y="405" fill="#7FB3FF" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">Tiempo: 2 a 4 seg</text>

    <rect x="650" y="190" width="200" height="240" rx="12" fill="url(#cardGrad)" stroke="#f87171" stroke-width="1.8"/>
    <circle cx="750" cy="235" r="22" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
    <text x="750" y="242" fill="#fca5a5" font-size="14" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">FASE 4</text>
    <text x="750" y="280" fill="#fca5a5" font-size="14" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">NEUTRALIZACIÓN</text>
    <line x1="675" y1="295" x2="825" y2="295" stroke="rgba(255,255,255,0.1)"/>
    <text x="750" y="325" fill="#ffffff" font-size="12" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">Solo Perímetro Exterior</text>
    <text x="750" y="350" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• G.A.T. responde al fuego</text>
    <text x="750" y="375" fill="#ef4444" font-size="11" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">NÚCLEO NO COMBATE</text>
    <text x="750" y="405" fill="#7FB3FF" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">Tiempo: Inmediato</text>

    <!-- Priority Banner -->
    <rect x="100" y="450" width="700" height="30" rx="8" fill="rgba(127, 29, 29, 0.4)" stroke="#ef4444" stroke-width="1"/>
    <text x="450" y="470" fill="#fca5a5" font-size="12" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">
      REGLA DE ORO: La cápsula NUNCA se queda a combatir. Nuestra victoria es evacuar ileso al protegido.
    </text>
  </svg>