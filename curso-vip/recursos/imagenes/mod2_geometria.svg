<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
    
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001433"/>
      <stop offset="35%" stop-color="#002C66"/>
      <stop offset="70%" stop-color="#003273"/>
      <stop offset="100%" stop-color="#001a40"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#FFB515"/>
      <stop offset="100%" stop-color="#C28600"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0069F2"/>
      <stop offset="100%" stop-color="#004DB3"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0, 50, 115, 0.9)"/>
      <stop offset="100%" stop-color="rgba(0, 26, 64, 0.9)"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 105, 242, 0.12)" stroke-width="1"/>
    </pattern>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#FFB515" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0069F2" />
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
    
  <!-- Background -->
  <rect width="900" height="520" fill="url(#bgGrad)"/>
  <rect width="900" height="520" fill="url(#grid)"/>

  <!-- Tactical Borders -->
  <rect x="20" y="20" width="860" height="480" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.85"/>
  <rect x="30" y="30" width="840" height="460" rx="12" fill="none" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1"/>

  <!-- Corner Brackets -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 70 L 860 40 L 830 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 40 450 L 40 480 L 70 480" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 450 L 860 480 L 830 480" fill="none" stroke="#FFB515" stroke-width="3"/>

  <!-- Header Badge -->
  <rect x="230" y="45" width="440" height="30" rx="15" fill="rgba(0, 44, 102, 0.95)" stroke="#004DB3" stroke-width="1.5"/>
  <text x="450" y="65" fill="#FFB515" font-size="12" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="2.5" text-anchor="middle">
    POLICÍA DE TIERRA DEL FUEGO • GEOMETRÍA DEFENSIVA
  </text>

  <!-- Title & Subtitle -->
  <text x="450" y="112" fill="#ffffff" font-size="24" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle" letter-spacing="0.5">
    PRINCIPIOS GEOMÉTRICOS DE LA CUSTODIA
  </text>
  <text x="450" y="138" fill="#7FB3FF" font-size="14" font-family="'Inter', sans-serif" font-weight="500" text-anchor="middle">
    Los Cuatro Fundamentos Matemáticos del Escudo Protector
  </text>

  <line x1="200" y1="155" x2="430" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  <polygon points="450,150 457,155 450,160 443,155" fill="#FFB515"/>
  <line x1="470" y1="155" x2="700" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  

    <!-- 4 Cardinal Cards -->
    <rect x="60" y="180" width="370" height="130" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.8"/>
    <circle cx="105" cy="245" r="25" fill="#001f48" stroke="#38bdf8" stroke-width="2"/>
    <text x="105" y="253" font-size="20" text-anchor="middle">🔄</text>
    <text x="145" y="215" fill="#38bdf8" font-size="15" font-family="'Outfit', sans-serif" font-weight="800">1. COBERTURA 360°</text>
    <text x="145" y="240" fill="#ffffff" font-size="12" font-family="'Inter', sans-serif" font-weight="600">El VIP es el centro geométrico absoluto</text>
    <text x="145" y="260" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">• Cada custodio domina un arco visual específico</text>
    <text x="145" y="280" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">• Cero puntos ciegos mediante superposición horaria</text>

    <rect x="470" y="180" width="370" height="130" rx="12" fill="url(#cardGrad)" stroke="#FFB515" stroke-width="1.8"/>
    <circle cx="515" cy="245" r="25" fill="#002C66" stroke="#FFB515" stroke-width="2"/>
    <text x="515" y="253" font-size="20" text-anchor="middle">📏</text>
    <text x="555" y="215" fill="#FFB515" font-size="15" font-family="'Outfit', sans-serif" font-weight="800">2. PROXIMIDAD INMEDIATA</text>
    <text x="555" y="240" fill="#ffffff" font-size="12" font-family="'Inter', sans-serif" font-weight="600">Distancia de un brazo al dignatario</text>
    <text x="555" y="260" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">• Permite cubrir con el cuerpo en milisegundos</text>
    <text x="555" y="280" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">• Agarre táctico del cinturón para dirigir evacuación</text>

    <rect x="60" y="330" width="370" height="130" rx="12" fill="url(#cardGrad)" stroke="#a78bfa" stroke-width="1.8"/>
    <circle cx="105" cy="395" r="25" fill="#001f48" stroke="#a78bfa" stroke-width="2"/>
    <text x="105" y="403" font-size="20" text-anchor="middle">🔔</text>
    <text x="145" y="365" fill="#a78bfa" font-size="15" font-family="'Outfit', sans-serif" font-weight="800">3. ALERTA CONSTANTE</text>
    <text x="145" y="390" fill="#ffffff" font-size="12" font-family="'Inter', sans-serif" font-weight="600">Código Amarillo de Cooper permanente</text>
    <text x="145" y="410" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">• Detección activa de manos, bultos y miradas</text>
    <text x="145" y="430" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">• Anticipación antes del inicio de cualquier agresión</text>

    <rect x="470" y="330" width="370" height="130" rx="12" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.8"/>
    <circle cx="515" cy="395" r="25" fill="#001f48" stroke="#34d399" stroke-width="2"/>
    <text x="515" y="403" font-size="20" text-anchor="middle">🚨</text>
    <text x="555" y="365" fill="#34d399" font-size="15" font-family="'Outfit', sans-serif" font-weight="800">4. EVACUACIÓN PRIORITARIA</text>
    <text x="555" y="390" fill="#ffffff" font-size="12" font-family="'Inter', sans-serif" font-weight="600">La cápsula NUNCA se queda a combatir</text>
    <text x="555" y="410" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">• Misión exclusiva: extraer al VIP a zona segura</text>
    <text x="555" y="430" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">• Solo el apoyo exterior (GAT) contiene la amenaza</text>
  </svg>