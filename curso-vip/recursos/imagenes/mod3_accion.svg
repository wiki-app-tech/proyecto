<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
    
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001433"/>
      <stop offset="35%" stop-color="#002C66"/>
      <stop offset="70%" stop-color="#003273"/>
      <stop offset="100%" stop-color="#001a40"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#FFB515"/>
      <stop offset="100%" stop-color="#C28600"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0069F2"/>
      <stop offset="100%" stop-color="#004DB3"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0, 50, 115, 0.9)"/>
      <stop offset="100%" stop-color="rgba(0, 26, 64, 0.9)"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 105, 242, 0.12)" stroke-width="1"/>
    </pattern>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#FFB515" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0069F2" />
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
    
  <!-- Background -->
  <rect width="900" height="520" fill="url(#bgGrad)"/>
  <rect width="900" height="520" fill="url(#grid)"/>

  <!-- Tactical Borders -->
  <rect x="20" y="20" width="860" height="480" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.85"/>
  <rect x="30" y="30" width="840" height="460" rx="12" fill="none" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1"/>

  <!-- Corner Brackets -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 70 L 860 40 L 830 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 40 450 L 40 480 L 70 480" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 450 L 860 480 L 830 480" fill="none" stroke="#FFB515" stroke-width="3"/>

  <!-- Header Badge -->
  <rect x="230" y="45" width="440" height="30" rx="15" fill="rgba(0, 44, 102, 0.95)" stroke="#004DB3" stroke-width="1.5"/>
  <text x="450" y="65" fill="#FFB515" font-size="12" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="2.5" text-anchor="middle">
    POLICÍA DE TIERRA DEL FUEGO • MATRIZ ESTRATÉGICA
  </text>

  <!-- Title & Subtitle -->
  <text x="450" y="112" fill="#ffffff" font-size="24" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle" letter-spacing="0.5">
    LA MATRIZ DE ACCIÓN FODA TÁCTICA
  </text>
  <text x="450" y="138" fill="#7FB3FF" font-size="14" font-family="'Inter', sans-serif" font-weight="500" text-anchor="middle">
    Cruce de Fortalezas, Oportunidades, Debilidades y Amenazas
  </text>

  <line x1="200" y1="155" x2="430" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  <polygon points="450,150 457,155 450,160 443,155" fill="#FFB515"/>
  <line x1="470" y1="155" x2="700" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  

    <!-- 4 Quadrants -->
    <!-- Top-Left: Estrategia FO -->
    <rect x="60" y="180" width="370" height="130" rx="10" fill="url(#cardGrad)" stroke="#34d399" stroke-width="2"/>
    <text x="80" y="205" fill="#34d399" font-size="14" font-family="'Outfit', sans-serif" font-weight="800">ESTRATEGIA FO (MAXI - MAXI)</text>
    <text x="80" y="225" fill="#ffffff" font-size="12" font-family="'Inter', sans-serif" font-weight="700">Escenario Ideal: Ofensiva / Dominio Pleno</text>
    <text x="80" y="248" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">• Usar fortalezas propias (entrenamiento de élite)</text>
    <text x="80" y="268" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">• Para aprovechar oportunidades del entorno (clima, apoyo)</text>
    <text x="80" y="295" fill="#34d399" font-size="11" font-family="'Inter', sans-serif" font-weight="700">ACCIÓN: Máxima fluidez y visibilidad protocolar</text>

    <!-- Top-Right: Estrategia FA -->
    <rect x="470" y="180" width="370" height="130" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2"/>
    <text x="490" y="205" fill="#38bdf8" font-size="14" font-family="'Outfit', sans-serif" font-weight="800">ESTRATEGIA FA (MAXI - MINI)</text>
    <text x="490" y="225" fill="#ffffff" font-size="12" font-family="'Inter', sans-serif" font-weight="700">Disuasión y Defensa Activa</text>
    <text x="490" y="248" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">• Usar fortalezas de la unidad (GAT, blindaje)</text>
    <text x="490" y="268" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">• Para neutralizar o disuadir amenazas externas</text>
    <text x="490" y="295" fill="#38bdf8" font-size="11" font-family="'Inter', sans-serif" font-weight="700">ACCIÓN: Despliegue visible y contención preventiva</text>

    <!-- Bottom-Left: Estrategia DO -->
    <rect x="60" y="330" width="370" height="130" rx="10" fill="url(#cardGrad)" stroke="#facc15" stroke-width="2"/>
    <text x="80" y="355" fill="#facc15" font-size="14" font-family="'Outfit', sans-serif" font-weight="800">ESTRATEGIA DO (MINI - MAXI)</text>
    <text x="80" y="375" fill="#ffffff" font-size="12" font-family="'Inter', sans-serif" font-weight="700">Mejora y Adaptación Táctica</text>
    <text x="80" y="398" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">• Superar debilidades internas (falta de vehículos)</text>
    <text x="80" y="418" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">• Aprovechando oportunidades (apoyo de policía local)</text>
    <text x="80" y="445" fill="#facc15" font-size="11" font-family="'Inter', sans-serif" font-weight="700">ACCIÓN: Coordinación interagencial y refuerzos</text>

    <!-- Bottom-Right: Estrategia DA -->
    <rect x="470" y="330" width="370" height="130" rx="10" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="2"/>
    <text x="490" y="355" fill="#ef4444" font-size="14" font-family="'Outfit', sans-serif" font-weight="800">ESTRATEGIA DA (MINI - MINI)</text>
    <text x="490" y="375" fill="#ffffff" font-size="12" font-family="'Inter', sans-serif" font-weight="700">Supervivencia / Defensiva Estricta</text>
    <text x="490" y="398" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">• Reducir debilidades propias al mínimo</text>
    <text x="490" y="418" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">• Evitar totalmente la exposición a amenazas graves</text>
    <text x="490" y="445" fill="#f87171" font-size="11" font-family="'Inter', sans-serif" font-weight="700">ACCIÓN: Cancelación de itinerario o repliegue total</text>

    <text x="450" y="485" fill="#FFB515" font-size="12" font-family="'Inter', sans-serif" font-weight="600" text-anchor="middle">
      "El FODA no es teoría de oficina: orienta qué formación y nivel de alerta desplegar hoy"
    </text>
  </svg>