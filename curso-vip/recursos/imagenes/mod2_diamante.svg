<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540">
    
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001433"/>
      <stop offset="35%" stop-color="#002C66"/>
      <stop offset="70%" stop-color="#003273"/>
      <stop offset="100%" stop-color="#001a40"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#FFB515"/>
      <stop offset="100%" stop-color="#C28600"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0069F2"/>
      <stop offset="100%" stop-color="#004DB3"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0, 50, 115, 0.9)"/>
      <stop offset="100%" stop-color="rgba(0, 26, 64, 0.9)"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 105, 242, 0.12)" stroke-width="1"/>
    </pattern>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#FFB515" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0069F2" />
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
    
  <!-- Background -->
  <rect width="900" height="540" fill="url(#bgGrad)"/>
  <rect width="900" height="540" fill="url(#grid)"/>

  <!-- Tactical Borders -->
  <rect x="20" y="20" width="860" height="500" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.85"/>
  <rect x="30" y="30" width="840" height="480" rx="12" fill="none" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1"/>

  <!-- Corner Brackets -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 70 L 860 40 L 830 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 40 470 L 40 500 L 70 500" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 470 L 860 500 L 830 500" fill="none" stroke="#FFB515" stroke-width="3"/>

  <!-- Header Badge -->
  <rect x="230" y="45" width="440" height="30" rx="15" fill="rgba(0, 44, 102, 0.95)" stroke="#004DB3" stroke-width="1.5"/>
  <text x="450" y="65" fill="#FFB515" font-size="12" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="2.5" text-anchor="middle">
    POLICÍA DE TIERRA DEL FUEGO • FORMACIÓN EN DIAMANTE
  </text>

  <!-- Title & Subtitle -->
  <text x="450" y="112" fill="#ffffff" font-size="24" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle" letter-spacing="0.5">
    SISTEMA DIAMANTE: MÁXIMA PROTECCIÓN PEDESTRE
  </text>
  <text x="450" y="138" fill="#7FB3FF" font-size="14" font-family="'Inter', sans-serif" font-weight="500" text-anchor="middle">
    Distribución de Roles, Sectores Visuales de 90° y Núcleo
  </text>

  <line x1="200" y1="155" x2="430" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  <polygon points="450,150 457,155 450,160 443,155" fill="#FFB515"/>
  <line x1="470" y1="155" x2="700" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  

    <!-- Diamond visual layout in center -->
    <!-- Center VIP & Jefe de Brigada -->
    <circle cx="450" cy="320" r="32" fill="#FFB515" opacity="0.2"/>
    <circle cx="450" cy="320" r="24" fill="#002C66" stroke="#FFB515" stroke-width="3" filter="url(#glow)"/>
    <text x="450" y="327" fill="#FFB515" font-size="14" font-family="'Outfit', sans-serif" font-weight="900" text-anchor="middle">VIP</text>

    <!-- Jefe de Brigada (Behind/Side VIP) -->
    <circle cx="420" cy="350" r="18" fill="#0069F2" stroke="#ffffff" stroke-width="2"/>
    <text x="420" y="356" fill="#ffffff" font-size="10" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">JB</text>

    <!-- Point 1: Vanguardia (Top) -->
    <circle cx="450" cy="205" r="22" fill="#001f48" stroke="#38bdf8" stroke-width="2"/>
    <text x="450" y="212" fill="#38bdf8" font-size="11" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">VANG</text>
    <path d="M 450 175 L 430 190 M 450 175 L 470 190" stroke="#38bdf8" stroke-width="2"/>

    <!-- Point 2: Flanco Izquierdo -->
    <circle cx="310" cy="320" r="22" fill="#001f48" stroke="#a78bfa" stroke-width="2"/>
    <text x="310" y="327" fill="#a78bfa" font-size="11" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">FL-IZQ</text>
    <path d="M 270 320 L 285 300 M 270 320 L 285 340" stroke="#a78bfa" stroke-width="2"/>

    <!-- Point 3: Flanco Derecho -->
    <circle cx="590" cy="320" r="22" fill="#001f48" stroke="#a78bfa" stroke-width="2"/>
    <text x="590" y="327" fill="#a78bfa" font-size="11" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">FL-DER</text>
    <path d="M 630 320 L 615 300 M 630 320 L 615 340" stroke="#a78bfa" stroke-width="2"/>

    <!-- Point 4: Retaguardia -->
    <circle cx="450" cy="435" r="22" fill="#001f48" stroke="#34d399" stroke-width="2"/>
    <text x="450" y="442" fill="#34d399" font-size="11" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">RETAG</text>
    <path d="M 450 465 L 430 450 M 450 465 L 470 450" stroke="#34d399" stroke-width="2"/>

    <!-- Diamond connecting lines -->
    <polygon points="450,205 590,320 450,435 310,320" fill="none" stroke="rgba(255,181,21,0.4)" stroke-width="2" stroke-dasharray="6 4"/>

    <!-- Legend box left -->
    <rect x="50" y="210" width="210" height="230" rx="10" fill="url(#cardGrad)" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
    <text x="155" y="235" fill="#FFB515" font-size="13" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">POSICIONES Y ROLES</text>
    <text x="65" y="265" fill="#38bdf8" font-size="11" font-family="'Inter', sans-serif" font-weight="700">⬆️ Vanguardia:</text>
    <text x="65" y="280" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif">Abre paso y domina 10 a 02</text>
    <text x="65" y="305" fill="#a78bfa" font-size="11" font-family="'Inter', sans-serif" font-weight="700">↔️ Flancos Izq/Der:</text>
    <text x="65" y="320" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif">Bloqueo lateral y visión 90°</text>
    <text x="65" y="345" fill="#34d399" font-size="11" font-family="'Inter', sans-serif" font-weight="700">⬇️ Retaguardia:</text>
    <text x="65" y="360" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif">Sella la espalda (04 a 08)</text>
    <text x="65" y="385" fill="#FFB515" font-size="11" font-family="'Inter', sans-serif" font-weight="700">⭐ Jefe de Brigada:</text>
    <text x="65" y="400" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif">Pegado al VIP como escudo</text>

    <!-- Legend box right -->
    <rect x="640" y="210" width="210" height="230" rx="10" fill="url(#cardGrad)" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
    <text x="745" y="235" fill="#FFB515" font-size="13" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">VENTAJAS TÁCTICAS</text>
    <text x="655" y="265" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">• <tspan fill="#ffffff" font-weight="700">Visión 360°:</tspan> 4 sectores</text>
    <text x="655" y="285" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">  de 90° complementarios</text>
    <text x="655" y="315" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">• <tspan fill="#ffffff" font-weight="700">Fluidez:</tspan> Penetra público</text>
    <text x="655" y="335" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">  y espacios angostos</text>
    <text x="655" y="365" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">• <tspan fill="#ffffff" font-weight="700">Extracción rápida:</tspan></text>
    <text x="655" y="385" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">  El núcleo evacúa en sentido</text>
    <text x="655" y="405" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">  opuesto al punto de agresión</text>

    <!-- Direction of movement -->
    <text x="450" y="165" fill="#38bdf8" font-size="12" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">▲ DIRECCIÓN DE AVANCE ▲</text>
  </svg>