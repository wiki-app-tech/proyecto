<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
    
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001433"/>
      <stop offset="35%" stop-color="#002C66"/>
      <stop offset="70%" stop-color="#003273"/>
      <stop offset="100%" stop-color="#001a40"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#FFB515"/>
      <stop offset="100%" stop-color="#C28600"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0069F2"/>
      <stop offset="100%" stop-color="#004DB3"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0, 50, 115, 0.9)"/>
      <stop offset="100%" stop-color="rgba(0, 26, 64, 0.9)"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 105, 242, 0.12)" stroke-width="1"/>
    </pattern>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#FFB515" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0069F2" />
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
    
  <!-- Background -->
  <rect width="900" height="520" fill="url(#bgGrad)"/>
  <rect width="900" height="520" fill="url(#grid)"/>

  <!-- Tactical Borders -->
  <rect x="20" y="20" width="860" height="480" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.85"/>
  <rect x="30" y="30" width="840" height="460" rx="12" fill="none" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1"/>

  <!-- Corner Brackets -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 70 L 860 40 L 830 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 40 450 L 40 480 L 70 480" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 450 L 860 480 L 830 480" fill="none" stroke="#FFB515" stroke-width="3"/>

  <!-- Header Badge -->
  <rect x="230" y="45" width="440" height="30" rx="15" fill="rgba(0, 44, 102, 0.95)" stroke="#004DB3" stroke-width="1.5"/>
  <text x="450" y="65" fill="#FFB515" font-size="12" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="2.5" text-anchor="middle">
    POLICÍA DE TIERRA DEL FUEGO • MANUAL INSTITUCIONAL
  </text>

  <!-- Title & Subtitle -->
  <text x="450" y="112" fill="#ffffff" font-size="24" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle" letter-spacing="0.5">
    ESTRUCTURA MODULAR COMPLETA DEL MANUAL MAESTRO 2026
  </text>
  <text x="450" y="138" fill="#7FB3FF" font-size="14" font-family="'Inter', sans-serif" font-weight="500" text-anchor="middle">
    Las Cuatro Secciones y Ocho Módulos de la Doctrina Unificada de Protección
  </text>

  <line x1="200" y1="155" x2="430" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  <polygon points="450,150 457,155 450,160 443,155" fill="#FFB515"/>
  <line x1="470" y1="155" x2="700" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  

    <!-- 4 Section Cards -->
    <rect x="50" y="180" width="180" height="250" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="140" y="205" fill="#38bdf8" font-size="11" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">SECCIÓN I</text>
    <text x="140" y="225" fill="#ffffff" font-size="12" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">FUNDAMENTOS</text>
    <line x1="65" y1="235" x2="215" y2="235" stroke="rgba(255,255,255,0.1)"/>
    <text x="140" y="265" fill="#FFB515" font-size="11" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">MÓDULO 1</text>
    <text x="140" y="285" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Investidura sobre cuerpo</text>
    <text x="140" y="305" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Círculos Concéntricos</text>
    <text x="140" y="325" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Código de Cooper</text>
    <text x="140" y="345" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Ecuación del Riesgo</text>

    <rect x="250" y="180" width="180" height="250" rx="10" fill="url(#cardGrad)" stroke="#FFB515" stroke-width="1.8"/>
    <text x="340" y="205" fill="#FFB515" font-size="11" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">SECCIÓN II</text>
    <text x="340" y="225" fill="#ffffff" font-size="12" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">OPERACIONES</text>
    <line x1="265" y1="235" x2="415" y2="235" stroke="rgba(255,255,255,0.1)"/>
    <text x="340" y="265" fill="#38bdf8" font-size="11" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">MÓDULOS 2 Y 3</text>
    <text x="340" y="285" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Formación Diamante/Cajón</text>
    <text x="340" y="305" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Convoy vehicular</text>
    <text x="340" y="325" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Análisis FODA táctico</text>
    <text x="340" y="345" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Emisión OPORD / MOTT</text>

    <rect x="450" y="180" width="180" height="250" rx="10" fill="url(#cardGrad)" stroke="#a78bfa" stroke-width="1.8"/>
    <text x="540" y="205" fill="#a78bfa" font-size="11" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">SECCIÓN III</text>
    <text x="540" y="225" fill="#ffffff" font-size="12" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">TÁCTICAS</text>
    <line x1="465" y1="235" x2="615" y2="235" stroke="rgba(255,255,255,0.1)"/>
    <text x="540" y="265" fill="#38bdf8" font-size="11" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">MÓDULOS 4 Y 5</text>
    <text x="540" y="285" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Estudio de Emplazamiento</text>
    <text x="540" y="305" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Cuarto Seguro y Requisa</text>
    <text x="540" y="325" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Art. 34 Código Penal</text>
    <text x="540" y="345" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Res. 202/00-JP y Ética</text>

    <rect x="650" y="180" width="200" height="250" rx="10" fill="url(#cardGrad)" stroke="#34d399" stroke-width="2" filter="url(#glow)"/>
    <text x="750" y="205" fill="#34d399" font-size="11" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">SECCIÓN IV</text>
    <text x="750" y="225" fill="#ffffff" font-size="12" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">ESPECIALIDADES</text>
    <line x1="665" y1="235" x2="835" y2="235" stroke="rgba(255,255,255,0.1)"/>
    <text x="750" y="265" fill="#38bdf8" font-size="11" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">MÓDULOS 6, 7 Y 8</text>
    <text x="750" y="285" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Bioseguridad y QBRN</text>
    <text x="750" y="305" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Socorrismo TECC / RCP</text>
    <text x="750" y="325" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Comando C4I y PEX</text>
    <text x="750" y="345" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Manual Maestro Consolidado</text>

    <text x="450" y="470" fill="#FFB515" font-size="12" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">
      Policía de Tierra del Fuego • Doctrina 2026 de Protección y Seguridad de Dignatarios
    </text>
  </svg>