    <rect x="655" y="310" width="195" height="150" rx="8" fill="url(#cardGrad)" stroke="#FFB515" stroke-width="1.5"/>
    <text x="752" y="338" font-size="20" text-anchor="middle">⚡</text>
    <text x="752" y="365" fill="#FFB515" font-size="13" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">APOYO TÁCTICO (CAT)</text>
    <line x1="675" y1="375" x2="830" y2="375" stroke="rgba(255,181,21,0.2)"/>
    <text x="752" y="398" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">"Potencia de fuego"</text>
    <text x="752" y="418" fill="#94a3b8" font-size="10.5" font-family="'Inter', sans-serif" text-anchor="middle">Ruptura de emboscadas,</text>
