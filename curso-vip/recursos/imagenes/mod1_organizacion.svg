    <text x="350" y="435" fill="#94a3b8" font-size="10.5" font-family="'Inter', sans-serif" text-anchor="middle">motor encendido</text>

    <rect x="460" y="310" width="180" height="150" rx="8" fill="url(#cardGrad)" stroke="rgba(0,105,242,0.4)" stroke-width="1.5"/>
