    <line x1="145" y1="285" x2="755" y2="285" stroke="rgba(0,105,242,0.6)" stroke-width="2"/>
    <line x1="145" y1="285" x2="145" y2="310" stroke="rgba(0,105,242,0.6)" stroke-width="2"/>
    <line x1="350" y1="285" x2="350" y2="310" stroke="rgba(0,105,242,0.6)" stroke-width="2"/>
    <line x1="550" y1="285" x2="550" y2="310" stroke="rgba(0,105,242,0.6)" stroke-width="2"/>
    <line x1="755" y1="285" x2="755" y2="310" stroke="rgba(0,105,242,0.6)" stroke-width="2"/>

    <rect x="50" y="310" width="190" height="150" rx="8" fill="url(#cardGrad)" stroke="rgba(0,105,242,0.4)" stroke-width="1.5"/>
    <text x="145" y="338" font-size="20" text-anchor="middle">👁️</text>
    <text x="145" y="365" fill="#7FB3FF" font-size="13" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">PUNTERO / AVANZADA</text>
    <line x1="70" y1="375" x2="220" y2="375" stroke="rgba(255,255,255,0.1)"/>
    <text x="145" y="398" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">"Los ojos del futuro"</text>
