    <text x="550" y="365" fill="#7FB3FF" font-size="13" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">FLANCOS Y RETAGUARDIA</text>
    <line x1="480" y1="375" x2="620" y2="375" stroke="rgba(255,255,255,0.1)"/>
    <text x="550" y="398" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">"Cobertura 360°"</text>
    <text x="550" y="418" fill="#94a3b8" font-size="10.5" font-family="'Inter', sans-serif" text-anchor="middle">Sectores horarios,</text>
