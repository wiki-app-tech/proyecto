    <line x1="275" y1="375" x2="425" y2="375" stroke="rgba(255,255,255,0.1)"/>
    <text x="350" y="398" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">"La vía de escape"</text>
