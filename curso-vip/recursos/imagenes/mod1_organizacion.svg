    <text x="345" y="224" font-size="18" text-anchor="middle">⭐</text>
    <text x="470" y="208" fill="#FFB515" font-size="15" font-family="'Outfit', sans-serif" font-weight="900" text-anchor="middle">JEFE DE CÁPSULA / TL</text>
