<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
    
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001433"/>
      <stop offset="35%" stop-color="#002C66"/>
      <stop offset="70%" stop-color="#003273"/>
      <stop offset="100%" stop-color="#001a40"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#FFB515"/>
      <stop offset="100%" stop-color="#C28600"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0069F2"/>
      <stop offset="100%" stop-color="#004DB3"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0, 50, 115, 0.9)"/>
      <stop offset="100%" stop-color="rgba(0, 26, 64, 0.9)"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 105, 242, 0.12)" stroke-width="1"/>
    </pattern>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#FFB515" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0069F2" />
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
    
  <!-- Background -->
  <rect width="900" height="500" fill="url(#bgGrad)"/>
  <rect width="900" height="500" fill="url(#grid)"/>

  <!-- Tactical Borders -->
  <rect x="20" y="20" width="860" height="460" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.85"/>
  <rect x="30" y="30" width="840" height="440" rx="12" fill="none" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1"/>

  <!-- Corner Brackets -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 70 L 860 40 L 830 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 40 430 L 40 460 L 70 460" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 430 L 860 460 L 830 460" fill="none" stroke="#FFB515" stroke-width="3"/>

  <!-- Header Badge -->
  <rect x="230" y="45" width="440" height="30" rx="15" fill="rgba(0, 44, 102, 0.95)" stroke="#004DB3" stroke-width="1.5"/>
  <text x="450" y="65" fill="#FFB515" font-size="12" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="2.5" text-anchor="middle">
    POLICÍA DE TIERRA DEL FUEGO • ROLES DE EJECUCIÓN
  </text>

  <!-- Title & Subtitle -->
  <text x="450" y="112" fill="#ffffff" font-size="24" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle" letter-spacing="0.5">
    EL ESCUDO OPERATIVO: EJECUCIÓN Y MOVILIDAD
  </text>
  <text x="450" y="138" fill="#7FB3FF" font-size="14" font-family="'Inter', sans-serif" font-weight="500" text-anchor="middle">
    Especialidades de Soporte y Dinámica de Desplazamiento
  </text>

  <line x1="200" y1="155" x2="430" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  <polygon points="450,150 457,155 450,160 443,155" fill="#FFB515"/>
  <line x1="470" y1="155" x2="700" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  

    <!-- 4 Cards -->
    <rect x="50" y="190" width="180" height="240" rx="12" fill="url(#cardGrad)" stroke="rgba(0, 105, 242, 0.5)" stroke-width="1.5"/>
    <circle cx="140" cy="240" r="26" fill="#001433" stroke="#0069F2" stroke-width="2"/>
    <text x="140" y="248" font-size="22" text-anchor="middle">🚘</text>
    <text x="140" y="290" fill="#ffffff" font-size="14" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">CONDUCTORES</text>
    <text x="140" y="315" fill="#FFB515" font-size="11" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">Móvil A, Piloto y Apoyo</text>
    <text x="140" y="340" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• Movilidad ininterrumpida</text>
    <text x="140" y="360" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• Conducción evasiva</text>
    <text x="140" y="380" fill="#f87171" font-size="11" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">NUNCA dejan el auto</text>

    <rect x="255" y="190" width="180" height="240" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="345" cy="240" r="26" fill="#001433" stroke="#38bdf8" stroke-width="2"/>
    <text x="345" y="248" font-size="22" text-anchor="middle">🛰️</text>
    <text x="345" y="290" fill="#38bdf8" font-size="14" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">CUSTODIO SATÉLITE</text>
    <text x="345" y="315" fill="#FFB515" font-size="11" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">Retaguardia Dinámica</text>
    <text x="345" y="340" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• Refuerza sector crítico</text>
    <text x="345" y="360" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• Cubre huecos y flancos</text>
    <text x="345" y="380" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• Alta flexibilidad</text>

    <rect x="460" y="190" width="180" height="240" rx="12" fill="url(#cardGrad)" stroke="#a78bfa" stroke-width="1.5"/>
    <circle cx="550" cy="240" r="26" fill="#001433" stroke="#a78bfa" stroke-width="2"/>
    <text x="550" y="248" font-size="22" text-anchor="middle">📍</text>
    <text x="550" y="290" fill="#a78bfa" font-size="14" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">PREVIAMENTE SITUADO</text>
    <text x="550" y="315" fill="#FFB515" font-size="11" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">Puntos de Embudo</text>
    <text x="550" y="340" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• Posición estática fija</text>
    <text x="550" y="360" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• Control de cuellos botella</text>
    <text x="550" y="380" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• Enlace visual inmediato</text>

    <rect x="665" y="190" width="185" height="240" rx="12" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.5"/>
    <circle cx="757" cy="240" r="26" fill="#001433" stroke="#34d399" stroke-width="2"/>
    <text x="757" y="248" font-size="22" text-anchor="middle">👁️</text>
    <text x="757" y="290" fill="#34d399" font-size="14" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">ENCARGADO BRIGADA</text>
    <text x="757" y="315" fill="#FFB515" font-size="11" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">Supervisión Periférica</text>
    <text x="757" y="340" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• Cierre de formación</text>
    <text x="757" y="360" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• Vista panorámica total</text>
    <text x="757" y="380" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• Ajusta ritmos y pasos</text>

    <rect x="120" y="450" width="660" height="30" rx="6" fill="rgba(0, 44, 102, 0.6)" stroke="#004DB3" stroke-width="1"/>
    <text x="450" y="470" fill="#cbd5e1" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">
      "Cada rol cumple una función milimétrica: no hay espacio para la improvisación ni la duplicación de tareas"
    </text>
  </svg>