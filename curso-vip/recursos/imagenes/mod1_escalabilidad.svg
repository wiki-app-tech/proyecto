<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
    
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001433"/>
      <stop offset="35%" stop-color="#002C66"/>
      <stop offset="70%" stop-color="#003273"/>
      <stop offset="100%" stop-color="#001a40"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#FFB515"/>
      <stop offset="100%" stop-color="#C28600"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0069F2"/>
      <stop offset="100%" stop-color="#004DB3"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0, 50, 115, 0.9)"/>
      <stop offset="100%" stop-color="rgba(0, 26, 64, 0.9)"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 105, 242, 0.12)" stroke-width="1"/>
    </pattern>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#FFB515" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0069F2" />
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
    
  <!-- Background -->
  <rect width="900" height="500" fill="url(#bgGrad)"/>
  <rect width="900" height="500" fill="url(#grid)"/>

  <!-- Tactical Borders -->
  <rect x="20" y="20" width="860" height="460" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.85"/>
  <rect x="30" y="30" width="840" height="440" rx="12" fill="none" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1"/>

  <!-- Corner Brackets -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 70 L 860 40 L 830 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 40 430 L 40 460 L 70 460" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 430 L 860 460 L 830 460" fill="none" stroke="#FFB515" stroke-width="3"/>

  <!-- Header Badge -->
  <rect x="230" y="45" width="440" height="30" rx="15" fill="rgba(0, 44, 102, 0.95)" stroke="#004DB3" stroke-width="1.5"/>
  <text x="450" y="65" fill="#FFB515" font-size="12" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="2.5" text-anchor="middle">
    POLICÍA DE TIERRA DEL FUEGO • NIVELES DE SEGURIDAD
  </text>

  <!-- Title & Subtitle -->
  <text x="450" y="112" fill="#ffffff" font-size="24" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle" letter-spacing="0.5">
    ESCALABILIDAD DEL DISPOSITIVO DE CUSTODIA
  </text>
  <text x="450" y="138" fill="#7FB3FF" font-size="14" font-family="'Inter', sans-serif" font-weight="500" text-anchor="middle">
    Adaptación del despliegue de recursos según el diagnóstico de riesgo y amenaza
  </text>

  <line x1="200" y1="155" x2="430" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  <polygon points="450,150 457,155 450,160 443,155" fill="#FFB515"/>
  <line x1="470" y1="155" x2="700" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  

    <rect x="70" y="190" width="230" height="250" rx="12" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="2"/>
    <rect x="70" y="190" width="230" height="35" rx="12" fill="#ef4444"/>
    <text x="185" y="214" fill="#ffffff" font-size="15" font-family="'Outfit', sans-serif" font-weight="900" text-anchor="middle">NIVEL ALTO</text>
    <text x="185" y="250" fill="#f87171" font-size="13" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">Riesgo Máximo / Hostil</text>
    <line x1="95" y1="265" x2="275" y2="265" stroke="rgba(255,255,255,0.1)"/>
    <text x="185" y="295" fill="#cbd5e1" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">• Cápsula completa (4-6)</text>
    <text x="185" y="320" fill="#cbd5e1" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">• Móvil Piloto + Apoyo</text>
    <text x="185" y="345" fill="#cbd5e1" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">• Equipo de Avanzada</text>
    <text x="185" y="370" fill="#cbd5e1" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">• Grupo Táctico (GEOF/TDF)</text>
    <rect x="95" y="395" width="180" height="26" rx="6" fill="#001f48"/>
    <text x="185" y="412" fill="#f87171" font-size="11" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">Amenaza Confirmada</text>

    <rect x="335" y="190" width="230" height="250" rx="12" fill="url(#cardGrad)" stroke="#FFB515" stroke-width="2"/>
    <rect x="335" y="190" width="230" height="35" rx="12" fill="#FFB515"/>
    <text x="450" y="214" fill="#001a40" font-size="15" font-family="'Outfit', sans-serif" font-weight="900" text-anchor="middle">NIVEL MEDIO</text>
    <text x="450" y="250" fill="#FFB515" font-size="13" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">Preventivo / Oficial</text>
    <line x1="360" y1="265" x2="540" y2="265" stroke="rgba(255,255,255,0.1)"/>
    <text x="450" y="295" fill="#cbd5e1" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">• Escolta personal reducida</text>
    <text x="450" y="320" fill="#cbd5e1" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">• Vehículo principal blindado</text>
    <text x="450" y="345" fill="#cbd5e1" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">• Enlace local con comisaría</text>
    <text x="450" y="370" fill="#cbd5e1" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">• Conductor de seguridad</text>
    <rect x="360" y="395" width="180" height="26" rx="6" fill="#001f48"/>
    <text x="450" y="412" fill="#FFB515" font-size="11" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">Actividad Institucional</text>

    <rect x="600" y="190" width="230" height="250" rx="12" fill="url(#cardGrad)" stroke="#0069F2" stroke-width="2"/>
    <rect x="600" y="190" width="230" height="35" rx="12" fill="#004DB3"/>
    <text x="715" y="214" fill="#ffffff" font-size="15" font-family="'Outfit', sans-serif" font-weight="900" text-anchor="middle">NIVEL BAJO</text>
    <text x="715" y="250" fill="#7FB3FF" font-size="13" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">Discreto / Rutinario</text>
    <line x1="625" y1="265" x2="805" y2="265" stroke="rgba(255,255,255,0.1)"/>
    <text x="715" y="295" fill="#cbd5e1" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">• Chofer-Escolta único</text>
    <text x="715" y="320" fill="#cbd5e1" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">• Vigilancia a distancia</text>
    <text x="715" y="345" fill="#cbd5e1" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">• Comunicación radial pasiva</text>
    <text x="715" y="370" fill="#cbd5e1" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">• Bajo perfil civil</text>
    <rect x="625" y="395" width="180" height="26" rx="6" fill="#001f48"/>
    <text x="715" y="412" fill="#7FB3FF" font-size="11" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">Actividad Privada</text>

    <text x="450" y="475" fill="#cbd5e1" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">
      La asignación del nivel es dinámica: se reevalúa cada 24 horas según inteligencia policial.
    </text>
  </svg>