<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
    
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001433"/>
      <stop offset="35%" stop-color="#002C66"/>
      <stop offset="70%" stop-color="#003273"/>
      <stop offset="100%" stop-color="#001a40"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#FFB515"/>
      <stop offset="100%" stop-color="#C28600"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0069F2"/>
      <stop offset="100%" stop-color="#004DB3"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0, 50, 115, 0.9)"/>
      <stop offset="100%" stop-color="rgba(0, 26, 64, 0.9)"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 105, 242, 0.12)" stroke-width="1"/>
    </pattern>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#FFB515" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0069F2" />
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
    
  <!-- Background -->
  <rect width="900" height="500" fill="url(#bgGrad)"/>
  <rect width="900" height="500" fill="url(#grid)"/>

  <!-- Tactical Borders -->
  <rect x="20" y="20" width="860" height="460" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.85"/>
  <rect x="30" y="30" width="840" height="440" rx="12" fill="none" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1"/>

  <!-- Corner Brackets -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 70 L 860 40 L 830 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 40 430 L 40 460 L 70 460" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 430 L 860 460 L 830 460" fill="none" stroke="#FFB515" stroke-width="3"/>

  <!-- Header Badge -->
  <rect x="230" y="45" width="440" height="30" rx="15" fill="rgba(0, 44, 102, 0.95)" stroke="#004DB3" stroke-width="1.5"/>
  <text x="450" y="65" fill="#FFB515" font-size="12" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="2.5" text-anchor="middle">
    POLICÍA DE TIERRA DEL FUEGO • REFUGIO TÁCTICO
  </text>

  <!-- Title & Subtitle -->
  <text x="450" y="112" fill="#ffffff" font-size="24" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle" letter-spacing="0.5">
    EL CUARTO SEGURO (SAFE ROOM) Y TEORÍA ESFÉRICA
  </text>
  <text x="450" y="138" fill="#7FB3FF" font-size="14" font-family="'Inter', sans-serif" font-weight="500" text-anchor="middle">
    Requisitos Estructurales del Refugio de Máxima Resistencia en Crisis
  </text>

  <line x1="200" y1="155" x2="430" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  <polygon points="450,150 457,155 450,160 443,155" fill="#FFB515"/>
  <line x1="470" y1="155" x2="700" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  

    <!-- Safe Room Central Box -->
    <rect x="250" y="190" width="400" height="230" rx="14" fill="url(#cardGrad)" stroke="#34d399" stroke-width="2.5" filter="url(#glow)"/>
    <rect x="250" y="190" width="400" height="40" rx="14" fill="#064e3b"/>
    <text x="450" y="216" fill="#a7f3d0" font-size="15" font-family="'Outfit', sans-serif" font-weight="900" text-anchor="middle">
      🛡️ CUARTO SEGURO (SAFE ROOM)
    </text>

    <!-- Characteristics list -->
    <text x="280" y="260" fill="#FFB515" font-size="12" font-family="'Inter', sans-serif" font-weight="800">🧱 Estructura Rígida:</text>
    <text x="300" y="278" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">Muros de mampostería maciza u hormigón armado. Sin ventanas.</text>

    <text x="280" y="305" fill="#FFB515" font-size="12" font-family="'Inter', sans-serif" font-weight="800">🔒 Acceso Blindado y Controlado:</text>
    <text x="300" y="323" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">Una sola puerta con tranca interior. Imposible abrir desde afuera.</text>

    <text x="280" y="350" fill="#FFB515" font-size="12" font-family="'Inter', sans-serif" font-weight="800">📡 Comunicaciones Autónomas:</text>
    <text x="300" y="368" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">Radio VHF fija, línea cableada protegida e inhibidor propio.</text>

    <text x="280" y="395" fill="#34d399" font-size="11" font-family="'Inter', sans-serif" font-weight="800">💧 Autonomía:</text>
    <text x="380" y="395" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">Agua, linternas, DEA y botiquín de trauma.</text>

    <!-- Left side: Anillos concéntricos -->
    <rect x="50" y="220" width="180" height="170" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="140" y="245" fill="#38bdf8" font-size="12" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">TEORÍA ESFÉRICA</text>
    <text x="65" y="275" fill="#ffffff" font-size="10" font-family="'Inter', sans-serif" font-weight="700">1. Esfera Externa:</text>
    <text x="65" y="290" fill="#cbd5e1" font-size="9" font-family="'Inter', sans-serif">Vallado y público</text>
    <text x="65" y="315" fill="#ffffff" font-size="10" font-family="'Inter', sans-serif" font-weight="700">2. Esfera Intermedia:</text>
    <text x="65" y="330" fill="#cbd5e1" font-size="9" font-family="'Inter', sans-serif">Puestos fijos edificio</text>
    <text x="65" y="355" fill="#34d399" font-size="10" font-family="'Inter', sans-serif" font-weight="700">3. Esfera Interna:</text>
    <text x="65" y="370" fill="#cbd5e1" font-size="9" font-family="'Inter', sans-serif">Cuarto Seguro VIP</text>

    <!-- Right side: Regla PEX -->
    <rect x="670" y="220" width="180" height="170" rx="10" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="760" y="245" fill="#f87171" font-size="12" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">CONDICIÓN PEX</text>
    <text x="685" y="275" fill="#ffffff" font-size="10" font-family="'Inter', sans-serif" font-weight="700">• Entrada Rápida:</text>
    <text x="685" y="290" fill="#cbd5e1" font-size="9" font-family="'Inter', sans-serif">&lt; 15 seg desde estrado</text>
    <text x="685" y="315" fill="#ffffff" font-size="10" font-family="'Inter', sans-serif" font-weight="700">• Resistencia Min.:</text>
    <text x="685" y="330" fill="#cbd5e1" font-size="9" font-family="'Inter', sans-serif">30 a 60 min hasta apoyo</text>
    <text x="685" y="355" fill="#fca5a5" font-size="10" font-family="'Inter', sans-serif" font-weight="700">• Nadie entra</text>
    <text x="685" y="370" fill="#cbd5e1" font-size="9" font-family="'Inter', sans-serif">sin clave de voz pactada</text>

    <text x="450" y="465" fill="#cbd5e1" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">
      "El Cuarto Seguro es el bastión inexpugnable mientras el G.A.T. neutraliza la amenaza exterior"
    </text>
  </svg>