<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
    
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001433"/>
      <stop offset="35%" stop-color="#002C66"/>
      <stop offset="70%" stop-color="#003273"/>
      <stop offset="100%" stop-color="#001a40"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#FFB515"/>
      <stop offset="100%" stop-color="#C28600"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0069F2"/>
      <stop offset="100%" stop-color="#004DB3"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0, 50, 115, 0.9)"/>
      <stop offset="100%" stop-color="rgba(0, 26, 64, 0.9)"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 105, 242, 0.12)" stroke-width="1"/>
    </pattern>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#FFB515" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0069F2" />
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
    
  <!-- Background -->
  <rect width="900" height="500" fill="url(#bgGrad)"/>
  <rect width="900" height="500" fill="url(#grid)"/>

  <!-- Tactical Borders -->
  <rect x="20" y="20" width="860" height="460" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.85"/>
  <rect x="30" y="30" width="840" height="440" rx="12" fill="none" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1"/>

  <!-- Corner Brackets -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 70 L 860 40 L 830 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 40 430 L 40 460 L 70 460" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 430 L 860 460 L 830 460" fill="none" stroke="#FFB515" stroke-width="3"/>

  <!-- Header Badge -->
  <rect x="230" y="45" width="440" height="30" rx="15" fill="rgba(0, 44, 102, 0.95)" stroke="#004DB3" stroke-width="1.5"/>
  <text x="450" y="65" fill="#FFB515" font-size="12" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="2.5" text-anchor="middle">
    POLICÍA DE TIERRA DEL FUEGO • USO DE FUERZA LETAL
  </text>

  <!-- Title & Subtitle -->
  <text x="450" y="112" fill="#ffffff" font-size="24" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle" letter-spacing="0.5">
    LA TRÍADA DE LA AMENAZA LETAL INMINENTE
  </text>
  <text x="450" y="138" fill="#7FB3FF" font-size="14" font-family="'Inter', sans-serif" font-weight="500" text-anchor="middle">
    Los Tres Elementos Simultáneos que Justifican el Fuego Defensivo
  </text>

  <line x1="200" y1="155" x2="430" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  <polygon points="450,150 457,155 450,160 443,155" fill="#FFB515"/>
  <line x1="470" y1="155" x2="700" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  

    <!-- 3 Triangular Nodes -->
    <!-- Top: Capacidad -->
    <rect x="330" y="180" width="240" height="90" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2"/>
    <text x="450" y="205" fill="#38bdf8" font-size="14" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">1. CAPACIDAD</text>
    <text x="450" y="225" fill="#ffffff" font-size="11" font-family="'Inter', sans-serif" font-weight="600" text-anchor="middle">Medio físico de daño</text>
    <text x="450" y="245" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">Arma de fuego, blanca, explosivo o vehículo</text>

    <!-- Connecting lines -->
    <line x1="370" y1="270" x2="220" y2="340" stroke="#FFB515" stroke-width="2"/>
    <line x1="530" y1="270" x2="680" y2="340" stroke="#FFB515" stroke-width="2"/>
    <line x1="320" y1="380" x2="580" y2="380" stroke="#FFB515" stroke-width="2"/>

    <!-- Bottom Left: Intención -->
    <rect x="90" y="340" width="240" height="90" rx="10" fill="url(#cardGrad)" stroke="#facc15" stroke-width="2"/>
    <text x="210" y="365" fill="#facc15" font-size="14" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">2. INTENCIÓN</text>
    <text x="210" y="385" fill="#ffffff" font-size="11" font-family="'Inter', sans-serif" font-weight="600" text-anchor="middle">Conducta hostil manifiesta</text>
    <text x="210" y="405" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">Actitud agresiva, encaramiento o amenaza verbal</text>

    <!-- Bottom Right: Oportunidad -->
    <rect x="570" y="340" width="240" height="90" rx="10" fill="url(#cardGrad)" stroke="#34d399" stroke-width="2"/>
    <text x="690" y="365" fill="#34d399" font-size="14" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">3. OPORTUNIDAD</text>
    <text x="690" y="385" fill="#ffffff" font-size="11" font-family="'Inter', sans-serif" font-weight="600" text-anchor="middle">Proximidad espacio-temporal</text>
    <text x="690" y="405" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">Distancia de alcance efectivo para herir</text>

    <!-- Center Convergence: Justificación Letal -->
    <circle cx="450" cy="340" r="34" fill="#7f1d1d" stroke="#ef4444" stroke-width="2.5" filter="url(#glow)"/>
    <text x="450" y="337" fill="#ffffff" font-size="10" font-family="'Outfit', sans-serif" font-weight="900" text-anchor="middle">FUEGO</text>
    <text x="450" y="350" fill="#fca5a5" font-size="9" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">LEGÍTIMO</text>

    <rect x="100" y="450" width="700" height="26" rx="6" fill="rgba(127, 29, 29, 0.5)" stroke="#ef4444" stroke-width="1"/>
    <text x="450" y="468" fill="#fca5a5" font-size="11" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">
      ¡Si falta UNO de los tres factores, el uso de la fuerza armada es ILEGÍTIMO y punible penalmente!
    </text>
  </svg>