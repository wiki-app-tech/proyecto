    <text x="452" y="388" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• Tiempos muertos</text>

    <rect x="540" y="180" width="145" height="240" rx="10" fill="url(#cardGrad)" stroke="rgba(0,105,242,0.5)" stroke-width="1.5"/>
    <circle cx="612" cy="225" r="24" fill="#001a40" stroke="#0069F2" stroke-width="1.5"/>
    <text x="612" y="233" fill="#7FB3FF" font-size="18" text-anchor="middle">4</text>
    <text x="612" y="275" fill="#7FB3FF" font-size="16" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">¿DÓNDE?</text>
    <text x="612" y="295" fill="#ffffff" font-size="12" font-family="'Inter', sans-serif" font-weight="600" text-anchor="middle">Escenario Físico</text>
    <line x1="555" y1="308" x2="670" y2="308" stroke="rgba(255,255,255,0.1)"/>
    <text x="612" y="328" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• Emplazamiento</text>
