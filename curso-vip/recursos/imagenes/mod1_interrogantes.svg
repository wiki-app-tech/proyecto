    <text x="772" y="388" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• Convoy y cápsula</text>

    <rect x="180" y="450" width="540" height="40" rx="8" fill="rgba(0, 31, 72, 0.9)" stroke="#004DB3" stroke-width="1"/>
    <text x="450" y="475" fill="#FFB515" font-size="13" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle">
