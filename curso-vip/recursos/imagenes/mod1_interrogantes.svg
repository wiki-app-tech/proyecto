    <rect x="220" y="180" width="145" height="240" rx="10" fill="url(#cardGrad)" stroke="rgba(0,105,242,0.5)" stroke-width="1.5"/>
    <circle cx="292" cy="225" r="24" fill="#001a40" stroke="#0069F2" stroke-width="1.5"/>
    <text x="292" y="233" fill="#7FB3FF" font-size="18" text-anchor="middle">2</text>
    <text x="292" y="275" fill="#7FB3FF" font-size="16" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">¿POR QUÉ?</text>
    <text x="292" y="295" fill="#ffffff" font-size="12" font-family="'Inter', sans-serif" font-weight="600" text-anchor="middle">Causa y Motivo</text>
