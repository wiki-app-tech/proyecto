    <text x="452" y="328" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• Agenda oficial</text>
    <text x="452" y="348" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">• Horarios de arribo</text>
