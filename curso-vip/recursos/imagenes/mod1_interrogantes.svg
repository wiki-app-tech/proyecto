    <rect x="700" y="180" width="145" height="240" rx="10" fill="url(#cardGrad)" stroke="#FFB515" stroke-width="1.5"/>
    <circle cx="772" cy="225" r="24" fill="#001a40" stroke="#FFB515" stroke-width="1.5"/>
    <text x="772" y="233" font-size="18" text-anchor="middle">5</text>
    <text x="772" y="275" fill="#FFB515" font-size="16" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">¿CÓMO?</text>
    <text x="772" y="295" fill="#ffffff" font-size="12" font-family="'Inter', sans-serif" font-weight="600" text-anchor="middle">Estructura Táctica</text>
    <line x1="715" y1="308" x2="830" y2="308" stroke="rgba(255,255,255,0.1)"/>
