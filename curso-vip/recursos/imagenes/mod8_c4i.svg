<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
    
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001433"/>
      <stop offset="35%" stop-color="#002C66"/>
      <stop offset="70%" stop-color="#003273"/>
      <stop offset="100%" stop-color="#001a40"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#FFB515"/>
      <stop offset="100%" stop-color="#C28600"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0069F2"/>
      <stop offset="100%" stop-color="#004DB3"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0, 50, 115, 0.9)"/>
      <stop offset="100%" stop-color="rgba(0, 26, 64, 0.9)"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 105, 242, 0.12)" stroke-width="1"/>
    </pattern>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#FFB515" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0069F2" />
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
    
  <!-- Background -->
  <rect width="900" height="500" fill="url(#bgGrad)"/>
  <rect width="900" height="500" fill="url(#grid)"/>

  <!-- Tactical Borders -->
  <rect x="20" y="20" width="860" height="460" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.85"/>
  <rect x="30" y="30" width="840" height="440" rx="12" fill="none" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1"/>

  <!-- Corner Brackets -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 70 L 860 40 L 830 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 40 430 L 40 460 L 70 460" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 430 L 860 460 L 830 460" fill="none" stroke="#FFB515" stroke-width="3"/>

  <!-- Header Badge -->
  <rect x="230" y="45" width="440" height="30" rx="15" fill="rgba(0, 44, 102, 0.95)" stroke="#004DB3" stroke-width="1.5"/>
  <text x="450" y="65" fill="#FFB515" font-size="12" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="2.5" text-anchor="middle">
    POLICÍA DE TIERRA DEL FUEGO • COMANDO Y CONTROL
  </text>

  <!-- Title & Subtitle -->
  <text x="450" y="112" fill="#ffffff" font-size="24" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle" letter-spacing="0.5">
    COMANDO, CONTROL Y COORDINACIÓN INTERAGENCIAL (C4I)
  </text>
  <text x="450" y="138" fill="#7FB3FF" font-size="14" font-family="'Inter', sans-serif" font-weight="500" text-anchor="middle">
    El Puesto de Comando Unificado (PCU) y la Integración con Fuerzas Federales y FFAA
  </text>

  <line x1="200" y1="155" x2="430" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  <polygon points="450,150 457,155 450,160 443,155" fill="#FFB515"/>
  <line x1="470" y1="155" x2="700" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  

    <!-- Top: Puesto de Comando Unificado -->
    <rect x="250" y="180" width="400" height="90" rx="12" fill="url(#cardGrad)" stroke="#FFB515" stroke-width="2.5" filter="url(#glow)"/>
    <circle cx="300" cy="225" r="24" fill="#002C66" stroke="#FFB515" stroke-width="2"/>
    <text x="300" y="233" font-size="20" text-anchor="middle">👑</text>
    <text x="340" y="212" fill="#FFB515" font-size="15" font-family="'Outfit', sans-serif" font-weight="900">
      PUESTO DE COMANDO UNIFICADO (PCU)
    </text>
    <text x="340" y="232" fill="#ffffff" font-size="12" font-family="'Inter', sans-serif" font-weight="600">
      Jefe de la División Custodia Gubernamental
    </text>
    <text x="340" y="250" fill="#7FB3FF" font-size="10" font-family="'Inter', sans-serif">
      Unicidad de mando • Frecuencia única encriptada • Monitoreo 24 hs
    </text>

    <!-- Branch lines -->
    <path d="M 450 270 L 450 310" stroke="#FFB515" stroke-width="2"/>
    <path d="M 170 310 L 730 310" stroke="#FFB515" stroke-width="2"/>
    <path d="M 170 310 L 170 335" stroke="#FFB515" stroke-width="2" marker-end="url(#arrowGold)"/>
    <path d="M 450 310 L 450 335" stroke="#FFB515" stroke-width="2" marker-end="url(#arrowGold)"/>
    <path d="M 730 310 L 730 335" stroke="#FFB515" stroke-width="2" marker-end="url(#arrowGold)"/>

    <!-- Bottom 3 Pillars -->
    <rect x="60" y="335" width="220" height="110" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="170" y="360" fill="#38bdf8" font-size="13" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">CÁPSULA VIP</text>
    <text x="170" y="380" fill="#ffffff" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">Jefe de Escolta (AIC)</text>
    <text x="170" y="400" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Contacto directo con VIP</text>
    <text x="170" y="420" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Movilidad y evacuación</text>

    <rect x="340" y="335" width="220" height="110" rx="10" fill="url(#cardGrad)" stroke="#FFB515" stroke-width="1.8"/>
    <text x="450" y="360" fill="#FFB515" font-size="13" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">AVANZADA / RECCE</text>
    <text x="450" y="380" fill="#ffffff" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">Jefe de Avanzada</text>
    <text x="450" y="400" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Cuarto Seguro y PPJ</text>
    <text x="450" y="420" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Desminado y perímetros</text>

    <rect x="620" y="335" width="220" height="110" rx="10" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.8"/>
    <text x="730" y="360" fill="#34d399" font-size="13" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle">ENLACE INTERAGENCIA</text>
    <text x="730" y="380" fill="#ffffff" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle">PFA • GNA • PNA • FFAA</text>
    <text x="730" y="400" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• Tránsito y cordón exterior</text>
    <text x="730" y="420" fill="#cbd5e1" font-size="10" font-family="'Inter', sans-serif" text-anchor="middle">• ZAE / Helipuerto y rescate</text>

    <text x="450" y="475" fill="#cbd5e1" font-size="12" font-family="'Inter', sans-serif" font-weight="600" text-anchor="middle">
      "Una sola voz de mando táctica: las demás fuerzas actúan en apoyo disciplinado a la cápsula"
    </text>
  </svg>