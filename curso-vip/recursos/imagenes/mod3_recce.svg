<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
    
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001433"/>
      <stop offset="35%" stop-color="#002C66"/>
      <stop offset="70%" stop-color="#003273"/>
      <stop offset="100%" stop-color="#001a40"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#FFB515"/>
      <stop offset="100%" stop-color="#C28600"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0069F2"/>
      <stop offset="100%" stop-color="#004DB3"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0, 50, 115, 0.9)"/>
      <stop offset="100%" stop-color="rgba(0, 26, 64, 0.9)"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 105, 242, 0.12)" stroke-width="1"/>
    </pattern>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#FFB515" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0069F2" />
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
    
  <!-- Background -->
  <rect width="900" height="500" fill="url(#bgGrad)"/>
  <rect width="900" height="500" fill="url(#grid)"/>

  <!-- Tactical Borders -->
  <rect x="20" y="20" width="860" height="460" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.85"/>
  <rect x="30" y="30" width="840" height="440" rx="12" fill="none" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1"/>

  <!-- Corner Brackets -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 70 L 860 40 L 830 40" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 40 430 L 40 460 L 70 460" fill="none" stroke="#FFB515" stroke-width="3"/>
  <path d="M 860 430 L 860 460 L 830 460" fill="none" stroke="#FFB515" stroke-width="3"/>

  <!-- Header Badge -->
  <rect x="230" y="45" width="440" height="30" rx="15" fill="rgba(0, 44, 102, 0.95)" stroke="#004DB3" stroke-width="1.5"/>
  <text x="450" y="65" fill="#FFB515" font-size="12" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="2.5" text-anchor="middle">
    POLICÍA DE TIERRA DEL FUEGO • MÉTODO DE ANÁLISIS
  </text>

  <!-- Title & Subtitle -->
  <text x="450" y="112" fill="#ffffff" font-size="24" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle" letter-spacing="0.5">
    METODOLOGÍA DE ANÁLISIS DE LA SITUACIÓN (MOTT)
  </text>
  <text x="450" y="138" fill="#7FB3FF" font-size="14" font-family="'Inter', sans-serif" font-weight="500" text-anchor="middle">
    Los 4 Factores Críticos: Misión, Oponente, Terreno y Tiempo
  </text>

  <line x1="200" y1="155" x2="430" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  <polygon points="450,150 457,155 450,160 443,155" fill="#FFB515"/>
  <line x1="470" y1="155" x2="700" y2="155" stroke="rgba(0, 105, 242, 0.4)" stroke-width="1.5"/>
  

    <!-- 4 Factores Grid -->
    <rect x="60" y="180" width="370" height="120" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.8"/>
    <circle cx="105" cy="240" r="22" fill="#001f48" stroke="#38bdf8" stroke-width="2"/>
    <text x="105" y="247" font-size="18" text-anchor="middle">🎯</text>
    <text x="140" y="215" fill="#38bdf8" font-size="15" font-family="'Outfit', sans-serif" font-weight="800">1. LA MISIÓN</text>
    <text x="140" y="235" fill="#ffffff" font-size="11" font-family="'Inter', sans-serif" font-weight="600">Definición exacta del objetivo operacional</text>
    <text x="140" y="255" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">• Ej: Traslado del Dignatario de Residencia a Casa de Gob.</text>
    <text x="140" y="275" fill="#7FB3FF" font-size="11" font-family="'Inter', sans-serif">¿Qué queremos lograr exactamente y con qué orden?</text>

    <rect x="470" y="180" width="370" height="120" rx="10" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="1.8"/>
    <circle cx="515" cy="240" r="22" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
    <text x="515" y="247" font-size="18" text-anchor="middle">👤</text>
    <text x="550" y="215" fill="#ef4444" font-size="15" font-family="'Outfit', sans-serif" font-weight="800">2. EL OPONENTE</text>
    <text x="550" y="235" fill="#ffffff" font-size="11" font-family="'Inter', sans-serif" font-weight="600">Inteligencia sobre la amenaza hostil</text>
    <text x="550" y="255" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">• ¿Quién es? ¿Qué capacidad tiene? ¿Dónde opera?</text>
    <text x="550" y="275" fill="#fca5a5" font-size="11" font-family="'Inter', sans-serif">Perfil del agresor, historial y armamento probable</text>

    <rect x="60" y="320" width="370" height="120" rx="10" fill="url(#cardGrad)" stroke="#FFB515" stroke-width="1.8"/>
    <circle cx="105" cy="380" r="22" fill="#002C66" stroke="#FFB515" stroke-width="2"/>
    <text x="105" y="387" font-size="18" text-anchor="middle">🗺️</text>
    <text x="140" y="355" fill="#FFB515" font-size="15" font-family="'Outfit', sans-serif" font-weight="800">3. EL TERRENO</text>
    <text x="140" y="375" fill="#ffffff" font-size="11" font-family="'Inter', sans-serif" font-weight="600">Estudio minucioso de vías y emplazamientos</text>
    <text x="140" y="395" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">• Cuellos de botella, embudos, obras y semáforos</text>
    <text x="140" y="415" fill="#fef08a" font-size="11" font-family="'Inter', sans-serif">10 rutas de escape, hospitales y zonas seguras</text>

    <rect x="470" y="320" width="370" height="120" rx="10" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.8"/>
    <circle cx="515" cy="380" r="22" fill="#001f48" stroke="#34d399" stroke-width="2"/>
    <text x="515" y="387" font-size="18" text-anchor="middle">⏱️</text>
    <text x="550" y="355" fill="#34d399" font-size="15" font-family="'Outfit', sans-serif" font-weight="800">4. EL TIEMPO</text>
    <text x="550" y="375" fill="#ffffff" font-size="11" font-family="'Inter', sans-serif" font-weight="600">Cronograma, luz solar y factores climáticos</text>
    <text x="550" y="395" fill="#cbd5e1" font-size="11" font-family="'Inter', sans-serif">• Horas de luz, nieve, hielo, niebla y viento fueguino</text>
    <text x="550" y="415" fill="#6ee7b7" font-size="11" font-family="'Inter', sans-serif">Cálculo de minutos exactos con margen de seguridad</text>

    <text x="450" y="470" fill="#cbd5e1" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">
      "El análisis MOTT convierte la confusión del terreno en certeza y ventaja táctica"
    </text>
  </svg>