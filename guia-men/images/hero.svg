<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1821" />
      <stop offset="40%" stop-color="#1b2a4a" />
      <stop offset="75%" stop-color="#324b6d" />
      <stop offset="100%" stop-color="#678096" />
    </linearGradient>
    <linearGradient id="glacierGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8f3dc" />
      <stop offset="50%" stop-color="#95d5b2" />
      <stop offset="100%" stop-color="#52b788" />
    </linearGradient>
    <linearGradient id="mountainBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#495867" />
      <stop offset="100%" stop-color="#24303d" />
    </linearGradient>
    <linearGradient id="mountainMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#314050" />
      <stop offset="100%" stop-color="#18232e" />
    </linearGradient>
    <linearGradient id="forestGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f362b" />
      <stop offset="100%" stop-color="#0d1b14" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#143642" />
      <stop offset="50%" stop-color="#006466" />
      <stop offset="100%" stop-color="#143642" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#skyGrad)" />

  <!-- Distant Andes Fueguinos / Sierra Alvear -->
  <polygon points="0,520 180,380 320,440 540,290 680,390 850,260 1020,410 1210,310 1380,420 1600,340 1600,900 0,900" fill="url(#mountainBack)" opacity="0.85" />

  <!-- Snow and Glacial Caps on Distant Peaks -->
  <polygon points="540,290 490,340 580,340" fill="#f0f7f4" opacity="0.9" />
  <polygon points="850,260 790,330 890,325" fill="#f0f7f4" opacity="0.95" />
  <polygon points="1210,310 1160,370 1260,360" fill="#e8f4f8" opacity="0.9" />
  <polygon points="180,380 140,420 220,415" fill="#d8e8ee" opacity="0.8" />

  <!-- Mid Ridge (Rugged Granite & Cirques) -->
  <polygon points="0,600 240,480 430,550 670,410 890,530 1100,430 1320,540 1600,470 1600,900 0,900" fill="url(#mountainMid)" />

  <!-- Hanging Glacier & Moraines -->
  <path d="M640,460 Q670,430 700,480 Q690,510 650,500 Z" fill="url(#glacierGrad)" opacity="0.8" />
  <path d="M1070,470 Q1100,445 1130,490 Q1110,520 1080,510 Z" fill="url(#glacierGrad)" opacity="0.75" />

  <!-- Forefront Lenga Forest and Peat Bog Valley -->
  <polygon points="0,720 160,670 320,700 480,650 640,680 820,640 1000,670 1180,630 1360,660 1600,620 1600,900 0,900" fill="url(#forestGrad)" />

  <!-- Lenga Trees Silhouette -->
  <g fill="#0b1711">
    <polygon points="80,730 95,680 110,730" />
    <polygon points="100,735 115,675 130,735" />
    <polygon points="220,710 235,660 250,710" />
    <polygon points="340,715 355,655 370,715" />
    <polygon points="510,690 525,630 540,690" />
    <polygon points="760,680 775,620 790,680" />
    <polygon points="940,690 955,635 970,690" />
    <polygon points="1120,675 1135,615 1150,675" />
    <polygon points="1280,685 1295,625 1310,685" />
    <polygon points="1440,665 1455,605 1470,665" />
  </g>

  <!-- Glacial Water Mirror / Canal Beagle Water Body -->
  <polygon points="0,810 500,800 1100,815 1600,795 1600,900 0,900" fill="url(#waterGrad)" />

  <!-- Light and Fog Subtle Haze Layer -->
  <rect y="700" width="1600" height="120" fill="#ffffff" opacity="0.05" />

  <!-- Topographic Contour Subtle Overlay -->
  <path d="M0,450 Q400,420 800,460 T1600,430" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="4,8" fill="none" opacity="0.25" />
  <path d="M0,550 Q400,520 800,560 T1600,530" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="4,8" fill="none" opacity="0.2" />
  <path d="M0,650 Q400,620 800,660 T1600,630" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="4,8" fill="none" opacity="0.15" />
</svg>
