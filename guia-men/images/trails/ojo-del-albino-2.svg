  <ellipse cx="410" cy="110" rx="60" ry="12" fill="#52b788" />
  <text x="30" y="475" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">CANALETA DE ACCESO Y PEDRERO · TRAMO TÉCNICO EXIGENTE</text>
</svg>
