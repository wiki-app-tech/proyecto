  <polygon points="260,0 560,0 480,500 350,500" fill="#374151" />
  <g fill="#4b5563">
    <polygon points="340,150 370,120 400,160" />
    <polygon points="420,240 450,200 480,250" />
    <polygon points="360,320 390,280 430,340" />
    <polygon points="410,410 440,370 470,420" />
