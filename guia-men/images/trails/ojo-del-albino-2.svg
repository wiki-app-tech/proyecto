      <stop offset="0%" stop-color="#14213d" />
      <stop offset="100%" stop-color="#3d5a80" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#albinoDetailSky)" />
  <!-- Massive Rock Wall & Gully / Canaleta de acceso -->
  <polygon points="0,0 260,0 350,500 0,500" fill="#1f2937" />
  <polygon points="560,0 800,0 800,500 480,500" fill="#1f2937" />
