<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="martialSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14213d" />
      <stop offset="60%" stop-color="#284b63" />
      <stop offset="100%" stop-color="#709775" />
    </linearGradient>
    <linearGradient id="martialIce" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f8ff" />
      <stop offset="50%" stop-color="#a8dadc" />
      <stop offset="100%" stop-color="#457b9d" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#martialSky)" />
  <!-- Montes Martial cirque amphitheater -->
  <polygon points="0,220 180,60 380,160 520,30 680,140 800,80 800,500 0,500" fill="#222e3c" />
  <!-- Martial Cirque Glacier Ice Sheet -->
  <polygon points="340,160 520,60 620,170 540,250 380,240" fill="url(#martialIce)" />
  <!-- Moraine scree slopes -->
  <polygon points="0,340 350,220 580,260 800,200 800,500 0,500" fill="#354251" />
  <!-- Ushuaia city & bay lights far below -->
  <ellipse cx="680" cy="380" rx="90" ry="20" fill="#1d3557" />
  <g fill="#fca311" opacity="0.7">
    <circle cx="640" cy="378" r="2" />
    <circle cx="660" cy="382" r="2" />
    <circle cx="685" cy="377" r="2.5" />
    <circle cx="710" cy="381" r="2" />
    <circle cx="730" cy="379" r="1.5" />
  </g>
  <!-- Senda del Filo rocky path in foreground -->
  <path d="M0,500 L250,410 L450,340 L540,280" stroke="#e63946" stroke-width="3" stroke-dasharray="6,4" fill="none" />
  <text x="30" y="475" fill="#f1faee" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">GLACIAR MARTIAL · SENDA DEL FILO (825 msnm) Y BALCÓN DE USHUAIA</text>
</svg>
