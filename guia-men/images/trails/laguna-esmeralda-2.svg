<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="leForestSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#223344" />
      <stop offset="100%" stop-color="#557788" />
    </linearGradient>
    <linearGradient id="peatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a5a36" />
      <stop offset="100%" stop-color="#3d2b1f" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#leForestSky)" />
  <!-- Distant mountain silhouette -->
  <polygon points="0,220 200,160 450,110 650,170 800,130 800,500 0,500" fill="#334455" />
  <!-- Lenga forest canopy -->
  <path d="M0,180 Q100,140 220,170 Q350,130 480,160 Q620,120 800,170 L800,500 L0,500 Z" fill="#14281d" />
  <!-- Sphagnum Peat bog valley (Turbera de esfagno) -->
  <polygon points="0,320 800,300 800,500 0,500" fill="url(#peatGrad)" />
  <ellipse cx="250" cy="380" rx="140" ry="25" fill="#4d3319" />
  <ellipse cx="600" cy="410" rx="180" ry="30" fill="#3b2612" />
  <!-- Trail boardwalk / path stones -->
  <path d="M100,500 L250,420 L400,370 L550,340 L700,320" stroke="#fca311" stroke-width="4" stroke-dasharray="10,6" fill="none" />
  <!-- Lenga tree trunks in foreground -->
  <line x1="80" y1="500" x2="110" y2="190" stroke="#2c1d11" stroke-width="16" />
  <line x1="720" y1="500" x2="690" y2="170" stroke="#2c1d11" stroke-width="20" />
  <text x="30" y="480" fill="#f8f9fa" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">SENDERO BOSCOSO Y TURBERA · VALLE TIERRA MAYOR</text>
</svg>
