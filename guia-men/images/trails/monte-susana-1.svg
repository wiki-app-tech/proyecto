<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="susanaSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="60%" stop-color="#4a7c9d" />
      <stop offset="100%" stop-color="#90b8d0" />
    </linearGradient>
    <linearGradient id="beagleWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d3557" />
      <stop offset="100%" stop-color="#0d1b2a" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#susanaSky)" />
  <!-- Chilean islands across Beagle Channel (Navarino & Hoste) -->
  <polygon points="0,270 200,210 420,240 650,190 800,220 800,500 0,500" fill="#2b4257" opacity="0.7" />
  <!-- Beagle Channel (Canal Beagle) water horizon -->
  <polygon points="0,290 800,275 800,420 0,440" fill="url(#beagleWater)" />
  <line x1="0" y1="285" x2="800" y2="280" stroke="#f1faee" stroke-width="1.5" opacity="0.3" />
  <!-- Monte Susana summit ridge in foreground -->
  <polygon points="0,380 320,320 540,360 800,310 800,500 0,500" fill="#1b4332" />
  <!-- Summit rock outcrop & cairn (apacheta) -->
  <polygon points="260,330 300,290 340,335" fill="#3d405b" />
  <rect x="294" y="275" width="12" height="18" fill="#5c677d" />
  <rect x="290" y="270" width="20" height="8" fill="#8d99ae" />
  <text x="30" y="475" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">MONTE SUSANA (520 msnm) · MIRADOR PANORÁMICO CANAL BEAGLE</text>
</svg>
