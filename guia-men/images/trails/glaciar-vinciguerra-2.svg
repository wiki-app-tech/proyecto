<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="andorraSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#andorraSky)" />
  <!-- Andorra Valley backdrop -->
  <polygon points="0,240 250,150 500,210 750,130 800,160 800,500 0,500" fill="#1e293b" />
  <!-- Dense Lenga mountain slope -->
  <polygon points="0,320 300,240 600,280 800,220 800,500 0,500" fill="#143625" />
  <!-- Arroyo Grande rushing waters in foreground -->
  <path d="M0,420 Q200,380 400,430 T800,390 L800,470 L0,490 Z" fill="#38bdf8" opacity="0.8" />
  <path d="M0,440 Q220,400 420,445 T800,410" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.6" />
  <!-- Peat moss mounds -->
  <ellipse cx="160" cy="470" rx="90" ry="25" fill="#583a22" />
  <ellipse cx="650" cy="465" rx="110" ry="25" fill="#432818" />
  <text x="30" y="475" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">VALLE DE ANDORRA Y ARROYO GRANDE · ACCESO A VINCIGUERRA</text>
</svg>
