  <path d="M420,290 Q400,380 340,440 T280,500" stroke="#70b8ff" stroke-width="6" fill="none" />
  <text x="30" y="475" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">ARROYO BUENA ESPERANZA Y APROXIMACIÓN AL CIRCO MARTIAL</text>
</svg>
