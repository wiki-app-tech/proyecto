<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="martialLowerSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2d3d" />
      <stop offset="100%" stop-color="#475b6d" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#martialLowerSky)" />
  <!-- Mountain contours and base trail -->
  <polygon points="0,260 280,180 550,220 800,160 800,500 0,500" fill="#2c3846" />
  <polygon points="0,380 400,280 800,340 800,500 0,500" fill="#1b2834" />
